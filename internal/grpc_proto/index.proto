syntax = "proto3";

// 包名
package index;

// Go 包路径：路径;包名（匹配输出目录，避免子包冲突）option go_package = ".;grpc_generated"
option go_package = "vibe_ip/internal/grpc_generated";

// 引入 HTTP 注解定义（用于 gateway）
import "google/api/annotations.proto";

// 引入空消息（用于无请求体的 RPC）
import "google/protobuf/empty.proto";

// 入口服务
service IndexService {
  // 入口
  rpc Index(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      get: "/"
    };
  }
}
