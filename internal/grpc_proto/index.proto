syntax = "proto3";

// 包名
package index;

// Go 包路径：路径;包名（匹配输出目录，避免子包冲突）option go_package = ".;grpc_generated"
option go_package = "vibe_ip/internal/grpc_generated";

// 引入 HTTP 注解定义（用于 gateway）
import "google/api/annotations.proto";

// 入口服务
service IndexService {
  // 入口
  rpc Index(IndexRequest) returns (IndexResponse) {
    option (google.api.http) = {
      get: "/"
    };
  }
}

// 入口 请求参数
message IndexRequest {
}

// 入口 响应参数
message IndexResponse {
    uint32 code = 1;
    string message = 2;
}