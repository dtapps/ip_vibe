syntax = "proto3";

// 包名
package open;

// Go 包路径：路径;包名（匹配输出目录，避免子包冲突）option go_package = ".;grpc_generated"
option go_package = "vibe_ip/internal/grpc_generated";

// 引入 HTTP 注解定义（用于 gateway）
import "google/api/annotations.proto";

// 引入验证规则（用于 protoc-gen-validate）
import "validate/validate.proto";

// 开放
service OpenService {
  // 设备上报IP
  rpc ReportDeviceIP(ReportDeviceIPRequest) returns (ReportDeviceIPResponse) {
    option (google.api.http) = {
      post: "/device/ip-report"
      body: "*"
    };
  }

  // 获取设备端口转发
  rpc GetDevicePortForwards(GetDevicePortForwardsRequest)
      returns (GetDevicePortForwardsResponse) {
    option (google.api.http) = {
      get: "/device/{device_code}/port-forwards"
    };
  }

  // 创建端口转发统计信息
  rpc CreatePortForwardStats(CreatePortForwardStatsRequest) returns (CreatePortForwardStatsResponse) {
    option (google.api.http) = {
      post: "/device/{device_code}/port-forwards/{port_forward_id}/stats"
      body: "*"
    };
  }
}

// 设备上报IP 请求参数
message ReportDeviceIPRequest {
  // 设备编码
  string device_code = 1 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 50,
      pattern: "^[a-zA-Z0-9_-]+$"  // 只允许字母、数字、下划线、连字符
    }
  ]; 
  
   // 设备名称
  string device_name = 2;
  
  // IP地址V4
  string ipv4_addr = 3;  
  
  // IP地址V6
  string ipv6_addr = 4; 
}

// 设备上报IP 响应参数
message ReportDeviceIPResponse {
  string msg = 1;          // 消息
}

// 获取设备端口转发 请求参数
message GetDevicePortForwardsRequest {
  // 设备编码
  string device_code = 1 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 50,
      pattern: "^[a-zA-Z0-9_-]+$"
    }
  ]; 
}

// 端口转发规则列表
message PortForwardRule {
  int64 id = 1;                   // 设备端口转发序号
  int32 local_port = 2;           // 本地监听端口
  string remote_host = 3;         // 远程目标地址
  int32 remote_port = 4;          // 远程目标端口
  repeated string protocols = 5;  // 协议列表，支持 tcp4, tcp6, udp4, udp6
  bool auto_forward = 6;          // 防火墙自动放行
}

// 获取设备端口转发 响应参数
message GetDevicePortForwardsResponse {
  repeated PortForwardRule rules = 1;  // 端口转发规则列表
}


// 创建端口转发统计信息 请求参数
message CreatePortForwardStatsRequest {
  // 设备编码
  string device_code = 1 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 50,
      pattern: "^[a-zA-Z0-9_-]+$"
    }
  ]; 
  
  // 端口转发ID
  int64 port_forward_id = 2 [
    (validate.rules).int64 = {
      gt: 0
    }
  ];
  
  // 转发实例启动时间 (UTC)
  int64 start_time = 3 [
    (validate.rules).int64 = {
      gt: 0
    }
  ];
  
  // TCP 活跃连接 / UDP session
  int64 active_conn = 4 ;

  // TCP 累计连接
  int64 total_conn = 5 ;

  // 入站流量
  int64 bytes_in = 6 ;
  
  // 出站流量
  int64 bytes_out = 7 ;
  
  // 入站 UDP 包数
  int64 udp_packets_in = 8 ;
  
  // 出站 UDP 包数
  int64 udp_packets_out = 9 ;
  
  // 错误数
  int64 errors = 10 ;
}

// 创建端口转发统计信息 响应参数
message CreatePortForwardStatsResponse {
}
