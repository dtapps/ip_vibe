syntax = "proto3";

// 包名
package open;

// Go 包路径：路径;包名（匹配输出目录，避免子包冲突）option go_package = ".;grpc_generated"
option go_package = "vibe_ip/internal/grpc_generated";

// 引入时间戳
import "google/protobuf/timestamp.proto";

// 引入验证规则（用于 protoc-gen-validate）
import "validate/validate.proto";

// 设备服务
service DeviceService {
  // 客户端通过此流注册并保持连接，服务端可感知在线状态并下发指令
  rpc Stream(stream ClientMessage) returns (stream ServerMessage);
}

// 客户端发送的消息
message ClientMessage {
  oneof payload {
    ClientInfo info = 1;      // 客户端基本信息
    Heartbeat heartbeat = 2;  // 客户端心跳消息
  }
}

// 客户端基本信息
message ClientInfo {
   // 设备编码
  string device_code = 1 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 50,
      pattern: "^[a-zA-Z0-9_-]+$"  // 只允许字母、数字、下划线、连字符
    }
  ];      
  // 设备名称
  string device_name = 2;
  // 角色
  string role = 3;
  // 版本号
  string version = 4;
  // git提交哈希
  string git_commit = 5;
  // 构建时间
  string build_time = 6;
  // go版本
  string go_version = 7;
  // 操作系统
  string os = 8;
  // 架构
  string arch = 9;
  // 启动时间
  google.protobuf.Timestamp start_time = 10;
  // 获取时间
  google.protobuf.Timestamp get_time = 11;
}

// 心跳消息（轻量，用于保活）
message Heartbeat {}


// 服务端下发的消息
message ServerMessage {
  oneof command {
    Ack ack = 1;
    RequestFullReport request_full_report = 2;
  }
}

message Ack {}

message RequestFullReport {}