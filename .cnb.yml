# CNB 流水线总入口：只负责聚合各工作流文件。
#
# 发布（Release）与镜像构建（Build Image）配置分别拆到 .cnb/workflows/ 下，便于复用；
# master 下均包含北京时间 00:00 的 nightly 定时触发，手动触发定义在各自工作流中。
# 注意：CNB 的 include 不支持跨文件使用 YAML 锚点（& / *），所以两个工作流块里的
# 锚点定义与对应事件的引用必须留在同一个文件里，不能跨 include 文件引用。
include:
  - .cnb/workflows/announcement-cleanup.yml
  - .cnb/workflows/build-image.yml
  - .cnb/workflows/pull-coverage.yml
  - .cnb/workflows/push-coverage.yml
  - .cnb/workflows/push.yml
  - .cnb/workflows/release.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/cnb-sechook.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/code-review.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/code-security-config.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/codewiki.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/knowledge-base.yml
  - https://cnb.cool/dtapp/ci-templates/-/blob/main/sca.yml
