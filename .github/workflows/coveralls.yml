# 覆盖率上报到 Coveralls（独立工作流）
#
# 为什么独立：
#   - 与 Codecov 解耦：Coveralls 侧故障 / token 失效不会拖垮 Codecov 上传与测试 job；
#   - 凭证隔离：只用内置 GITHUB_TOKEN + COVERALLS_REPO_TOKEN，不扩散到 Codecov 流程；
#   - Codecov 那条（.github/workflows/coverage.yml）已经跑通，不动它。
#
# 代价：本工作流会把测试再跑一遍（与 coverage.yml 重复）。这是「独立」换来的隔离性。
#
# 为什么是单个 job（而不是 go / node 拆两个 job）：
#   Coveralls 以 build 为单位聚合报告，go / node 两份报告必须落在同一个 build 里，
#   再靠 flag 合并；同一个 job 上传天然同 build。拆成两个 job 需要完整的
#   parallel + parallel-finished 协议，两侧混用不同上传器容易踩坑，
#   故这里保持单 job 顺序执行，换取确定性。
#
# 测试命令统一走 Makefile 目标（make cover-go / make cover-node），
# 与 CNB 流水线共用同一份定义，口径不会漂移；详见 Makefile「测试覆盖率」一节。
#
# 参考：
#   https://github.com/coverallsapp/github-action
name: Coveralls

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: coveralls-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  coverage:
    runs-on: ubuntu-latest
    # 统一使用 dtapps 维护的 CI 基础镜像；本仓库不再自建、推送 CI 镜像。
    container:
      image: ghcr.io/dtapps/golang:latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        run: make deps

      # 口径与 CNB 一致，统一走 Makefile 目标（命令唯一定义在 Makefile 的 cover-go-lcov）
      # Go 覆盖率以 lcov 格式上传（而非 format: golang）：Coveralls 的 golang parser
      # 会用正则硬吃 3 段包前缀只留 basename，导致 243 个文件全坍缩到同一级；
      # lcov parser 的 SF: 保留完整路径，故走 lcov 绕开该正则。详见 Makefile cover-go-lcov。
      - name: 生成 Go 测试覆盖率（lcov）
        run: make cover-go-lcov

      - name: 上传 Go 覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage-lcov.info
          format: lcov
          flag-name: go

      - name: 生成前端测试覆盖率
        run: make cover-node # 产出 cmd/frontend/coverage/lcov.info

      - name: 上传前端覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./cmd/frontend/coverage/lcov.info
          flag-name: node
