# 覆盖率上报到 Codecov（GitHub 侧，与 CNB 的 testing:coverage 门禁相互独立）
# 职责分离：
#   - CNB 流水线（.cnb/workflows/push-coverage.yml、pull-coverage.yml）负责硬性红线
#     门禁（lines / diffLines），阻断低覆盖率合并；
#   - 本工作流负责把覆盖率上传到 Codecov（PR 评论 + 徽章 + patch 状态）。
# 因覆盖率产物需在 GitHub Actions 环境内生成，这里自行跑一遍测试（与 CNB 重复，
# 但各自独立，互不依赖）。配置见 .github/codecov.yml。
# https://github.com/actions/checkout
# https://github.com/codecov/codecov-action
# https://github.com/actions/setup-go
# https://github.com/pnpm/action-setup
# https://github.com/actions/setup-node
# https://github.com/codecov/test-results-action
name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 同一分支的多次 push 不取消旧的运行。
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    # 直接用预构建的 CI 镜像（含 Go/Node/pnpm + 全部 Go 工具链），
    # 免去每次 go install 工具。镜像由 ci-image.yml 在 Dockerfile 变动时
    # 自动重建并推送到 GHCR；首次使用前需先跑一次 ci-image.yml 让镜像存在。
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      # 无需 setup-go/node、make tool-deps——镜像里都已就绪。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        run: make deps

      # 口径与 CNB 一致，统一走 Makefile 目标（命令唯一定义在 Makefile 的 cover-go）
      - name: 生成 Go 测试覆盖率与测试报告
        run: make junit-go # 产出 coverage.out + go-test-report.xml

      - name: 生成前端测试覆盖率
        run: make cover-node # 产出 cmd/frontend/coverage/lcov.info

      - name: 生成前端测试报告
        run: make junit-node # 产出 cmd/frontend/coverage/junit.xml

      - name: 上传 Go 覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false

      - name: 上传前端覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cmd/frontend/coverage/lcov.info
          flags: node
          fail_ci_if_error: false

      # 构建前端静态资源（tailwindcss + 第三方 dist 拷贝 → cmd/backend/static/）。
      # 不做 Codecov Bundle Analysis：该项目前端是 vanilla JS，无 vite/webpack 打包器，
      # 产物也无 sourcemap，@codecov/vite-plugin 与 codecov-action 的 bundle: 都无处可用；
      # 若将来引入打包器并产出 sourcemap，再在 codecov-action 里加 bundle: 即可。
      - name: 构建前端
        run: make build-frontend

      # 上传测试结果到 Codecov（Tests 面板）：Go 与前端各一份 JUnit XML
      - name: 上传测试结果到 Codecov
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./go-test-report.xml,./cmd/frontend/coverage/junit.xml
          fail_ci_if_error: false
