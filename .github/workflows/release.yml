# 发布工作流
#
# 手动触发，输入版本号后自动构建全平台二进制包（zip / tar.gz）并发布 GitHub Release。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 CNB 的 .cnb/workflows/release.yml 同口径）：
#   v1.2.3          -> 正式版，Release 不勾选 prerelease
#   v1.2.3-rc.1     -> 预发布，Release 勾选 prerelease
#   v1.2.3-beta.1   -> 预发布，Release 勾选 prerelease
#   v1.2.3-alpha.1  -> 预发布，Release 勾选 prerelease
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1；没有后缀就是正式版'
        required: true
        type: string

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 统一使用 dtapps 维护的 CI 基础镜像（含 Go/Node/pnpm + 工具链），
    # 免去每次重装系统库与 go install 工具；本仓库不再自建、推送 CI 镜像。
    container:
      image: ghcr.io/dtapps/golang:latest
    outputs:
      interior_version: ${{ steps.gen.outputs.interior_version }}
      interior_release_title: ${{ steps.gen.outputs.interior_release_title }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 解析版本号（预发布看后缀）
        id: gen
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 归一化 / 格式校验 / 预发布判定只有一份实现，release.yml 与 build-image.yml 共用
          # shellcheck source=scripts/ci/resolve-prerelease.sh
          . scripts/ci/resolve-prerelease.sh
          resolve_version "${VERSION}"

          echo "${PRE_NOTE}"

          # 预发布版本在标题上带个后缀，便于在 Release 列表里一眼区分
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="${TAG} (预发布)"
          else
            RELEASE_TITLE="${TAG}"
          fi

          {
            echo "interior_version=${TAG}"
            echo "interior_release_title=${RELEASE_TITLE}"
            # 只在本流水线 job 之间传，不再来自用户输入
            echo "pre_release=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  # 构建全平台二进制并压缩（linux/windows/darwin × amd64/arm64）
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dtapps/golang:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # go build 默认做 VCS 盖章，会调用 `git status --porcelain`。容器 job 的工作区是
      # runner 挂进来的 bind mount（属主是 runner 用户），容器内进程却是 root，git 会判定
      # dubious ownership 并 exit 128 —— 而 cmd/go 对这次调用用 runOutputVerboseOnly，
      # 会把 git 的 stderr 吞掉，日志里只剩 “error obtaining VCS status: exit status 128”。
      # 这里写 system 作用域（容器内 root 可写 /etc/gitconfig，不依赖 $HOME 是否可写），
      # 让容器里的 git 正常可用（Makefile 里 `git rev-parse`/`git describe` 也依赖它）。
      - name: 让容器内的 git 可用
        shell: bash
        run: |
          git config --system --add safe.directory '*' 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

          # 结果打进日志：以后一眼能看出这条登记有没有生效
          if git status --porcelain > /dev/null 2>&1; then
            echo "✓ 容器内 git 可用，COMMIT=$(git rev-parse --short HEAD)"
          else
            echo "⚠️ 容器内 git 仍不可用，构建由 -buildvcs=false 兜底"
          fi

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        shell: bash
        run: make deps

      - name: 构建前端静态文件
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
        run: VERSION="${VERSION}" make build-frontend

      # build-all 会先 clean（清空 bin/），再逐个平台编译 backend/reporter/forwarder，
      # 每编完一个就打包成 tar.gz（Windows 为 zip）并删掉未压缩的二进制。
      - name: 构建所有平台二进制文件
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
        run: VERSION="${VERSION}" make build-all

      # 兜底清理：确保 bin/ 里只剩可发布的压缩包（build-all 里的打包缺失时不会留下裸二进制）
      - name: 清理二进制文件
        shell: bash
        run: make clean-binaries

      - name: 生成校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd bin
          : > SHA256SUMS
          for f in *.tar.gz *.zip; do
            [ -e "${f}" ] || continue
            sha256sum "${f}" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ip_vibe-release
          path: bin/*
          if-no-files-found: error
          retention-days: 1

  # 构建完成后，发布 GitHub Release
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 历史，才能算出「上一个 tag」并生成 changelog
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          name: ip_vibe-release
          path: release

      # 发版前先把版本号这件事验干净。这几件事出错都不会让构建失败，
      # 但会发出一个「看起来成功、内容是错的」Release。
      - name: 校验版本号与 tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
        run: |
          set -euo pipefail
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"
          if [ "$count" -eq 0 ]; then
            echo "❌ 一个版本 tag 都没有，changelog 会退化成「首次发布」"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "❌ tag ${VERSION} 已存在，不能重复发布"
            exit 1
          fi
          echo "✅ tag ${VERSION} 不存在，可以发布"

          if [ "${PRERELEASE}" = "false" ]; then
            latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
              echo "❌ 版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
              exit 1
            fi
            echo "✅ 比上一个正式版 ${latest:-（无）} 新"
          fi

      # 正文与更新内容只有一份实现（scripts/ci/*.sh），CNB 那份也调用同样的脚本，
      # 避免两边各写一遍表格/标题/下载链接，改一处忘一处。
      - name: 生成 Release 正文
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
          REPO_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_DIR: release
          ARTIFACT_LAYOUT: triplet # 本仓库是 backend/reporter/forwarder 三服务
          OUT_FILE: release_body.md
        run: |
          set -euo pipefail

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、正式版对正式版；
          # 首次发某渠道则回退到上一个正式版）。实现见 scripts/ci/release-changelog.sh。
          # GitHub 的提交路径是 /commit/<sha>，和 CNB 的 /-/commit 不同，前缀显式传
          CHANGELOG=$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}")
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效，
          # 本 step 里读不到，之前那样写 CHANGELOG 会是空的。
          export CHANGELOG

          sh scripts/ci/render-release-body.sh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.interior_version }}
          name: ${{ needs.prepare.outputs.interior_release_title }}
          draft: false
          # 版本号带 rc/beta/alpha 才勾选预发布，正式版不勾
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          body_path: release_body.md
          files: release/*
