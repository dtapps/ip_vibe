# 发布工作流
#
# 两种触发：手动填版本号；每天 UTC 00:00（北京时间 08:00）定时构建 nightly 预发布。
# 手动触发时构建全平台二进制包（zip / tar.gz）并发布 GitHub Release，
# 随后触发 CNB / Gitee / GitLab / GitCode 四个平台的发布同步（各自 secret 未配置则跳过），
# 最后通过 ServerChan3（方糖）推一条构建完成通知。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 CNB 的 .cnb/workflows/release.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 「是不是预发布」不接受人工勾选，只看版本号后缀：布尔输入会和版本号打架。
#
# Release 标题：IPVibe <版本号>，预发布再加 "(预发布)" 后缀；tag 始终是纯版本号。
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/dtapps/golang
name: Release

on:
  # 每天 UTC 00:00（北京时间 08:00）。
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；填 nightly 自动推导当天夜间构建版本；没有后缀就是正式版'
        required: true
        type: string
      commit:
        description: '可选：要发布的代码版本（完整 SHA / 分支 / tag）。留空则用触发时的 HEAD'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-26.04
    # 统一使用 dtapps 维护的 CI 基础镜像（含 Go/Node/pnpm + 工具链），
    # 免去每次重装系统库与 go install 工具；本仓库不再自建、推送 CI 镜像。
    container:
      image: ghcr.io/dtapps/golang:latest
    outputs:
      interior_version: ${{ steps.gen.outputs.interior_version }}
      interior_release_title: ${{ steps.gen.outputs.interior_release_title }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
      commit_full: ${{ steps.gen.outputs.commit_full }}
      commit_short: ${{ steps.gen.outputs.commit_short }}
      build_time: ${{ steps.gen.outputs.build_time }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # nightly 推导要取「最近正式版」tag，changelog 也要按 tag 算对比基准，
          # 所以必须带完整 tag 历史（浅克隆里看不到 tag）。
          fetch-depth: 0
          # 不填 commit 时用触发时的 SHA，三个 job 落在同一个提交上
          ref: ${{ inputs.commit || github.sha }}

      - name: 解析版本号（预发布看后缀）
        id: gen
        shell: bash
        env:
          # 定时触发没有 inputs，等价于手动填 `nightly`；手动触发仍以输入为准。
          VERSION: ${{ github.event_name == 'schedule' && 'nightly' || inputs.version }}
        run: |
          set -euo pipefail

          # 容器 job 的工作区属主是 runner，先登记 safe.directory 才能 rev-parse。
          # 统一以「实际检出的 HEAD」为准：完整 SHA 给正文链接 / tag，短 SHA 给构建标记。
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          commit_full="$(git rev-parse HEAD)"
          commit_short="$(git rev-parse --short HEAD)"
          echo "构建 commit: ${commit_short} (${commit_full})"

          # 归一化 / 格式校验 / 预发布判定只有一份实现，release.yml 与 build-image.yml 共用
          # shellcheck source=scripts/ci/resolve-prerelease.sh
          . scripts/ci/resolve-prerelease.sh
          # `nightly` 不是版本号，脚本内部会展开成
          # v<最近正式版 +1 补丁>-nightly.<UTC 日期>（读的是本地 tag 历史）。
          resolve_version "${VERSION}"

          echo "${PRE_NOTE}"

          # 统一构建时间：nightly 版本号里的日期、通知里展示的时间都用它
          BUILD_TIME="$(bash scripts/get-build-time.sh)"
          [ -n "${BUILD_TIME}" ] || BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "构建时间: ${BUILD_TIME}"

          # 标题统一带项目名（tag 仍是纯版本号），便于在 Release 列表里一眼认出是哪个项目；
          # 预发布再加后缀，和正式版区分开
          PROJECT_NAME="IPVibe"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="${PROJECT_NAME} ${TAG} (预发布)"
          else
            RELEASE_TITLE="${PROJECT_NAME} ${TAG}"
          fi

          {
            echo "interior_version=${TAG}"
            echo "interior_release_title=${RELEASE_TITLE}"
            # 只在本流水线 job 之间传，不再来自用户输入
            echo "pre_release=${PRERELEASE}"
            echo "commit_full=${commit_full}"
            echo "commit_short=${commit_short}"
            echo "build_time=${BUILD_TIME}"
          } >> "$GITHUB_OUTPUT"

  # 构建全平台二进制并压缩（linux/windows/darwin × amd64/arm64）
  build:
    needs: prepare
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 用 prepare 解析出的完整 SHA，保证与 prepare / release 同一个提交
          ref: ${{ needs.prepare.outputs.commit_full }}

      # go build 默认做 VCS 盖章，会调用 `git status --porcelain`。容器 job 的工作区是
      # runner 挂进来的 bind mount（属主是 runner 用户），容器内进程却是 root，git 会判定
      # dubious ownership 并 exit 128 —— 而 cmd/go 对这次调用用 runOutputVerboseOnly，
      # 会把 git 的 stderr 吞掉，日志里只剩 “error obtaining VCS status: exit status 128”。
      # 这里写 system 作用域（容器内 root 可写 /etc/gitconfig，不依赖 $HOME 是否可写），
      # 让容器里的 git 正常可用（Makefile 里 `git rev-parse`/`git describe` 也依赖它）。
      - name: 让容器内的 git 可用
        shell: bash
        run: |
          git config --system --add safe.directory '*' 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

          # 结果打进日志：以后一眼能看出这条登记有没有生效
          if git status --porcelain > /dev/null 2>&1; then
            echo "✓ 容器内 git 可用，COMMIT=$(git rev-parse --short HEAD)"
          else
            echo "⚠️ 容器内 git 仍不可用，构建由 -buildvcs=false 兜底"
          fi

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        shell: bash
        run: make deps

      - name: 构建前端静态文件
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
        run: VERSION="${VERSION}" make build-frontend

      # build-all 会先 clean（清空 bin/），再逐个平台编译 backend/reporter/forwarder，
      # 每编完一个就打包成 tar.gz（Windows 为 zip）并删掉未压缩的二进制。
      - name: 构建所有平台二进制文件
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          COMMIT: ${{ needs.prepare.outputs.commit_short }}
        run: VERSION="${VERSION}" COMMIT="${COMMIT}" make build-all

      # 兜底清理：确保 bin/ 里只剩可发布的压缩包（build-all 里的打包缺失时不会留下裸二进制）
      - name: 清理二进制文件
        shell: bash
        run: make clean-binaries

      - name: 生成校验文件
        shell: bash
        run: |
          set -euo pipefail
          cd bin
          : > SHA256SUMS
          for f in *.tar.gz *.zip; do
            [ -e "${f}" ] || continue
            sha256sum "${f}" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: ip_vibe-release
          path: bin/*
          if-no-files-found: error
          retention-days: 1

  # 构建完成后，发布 GitHub Release
  release:
    needs: [prepare, build]
    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 用 prepare 解析出的完整 SHA，保证与 prepare / build 同一个提交
          ref: ${{ needs.prepare.outputs.commit_full }}
          # 需要完整 tag 历史，才能算出「上一个 tag」并生成 changelog
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          name: ip_vibe-release
          path: release

      # 发版前先把版本号这件事验干净。这几件事出错都不会让构建失败，
      # 但会发出一个「看起来成功、内容是错的」Release。
      - name: 校验版本号与 tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
        run: |
          set -euo pipefail
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"
          if [ "$count" -eq 0 ]; then
            echo "::error::一个版本 tag 都没有，changelog 会退化成「首次发布」"
            echo "   检查 checkout 是否带 tag（fetch-depth: 0），或手动 git fetch --tags"
            exit 1
          fi

          case "${VERSION}" in
            *-nightly.*)
              # 夜间构建按天发布同一个 tag（同一天重跑/补发要能覆盖），
              # 允许 tag 已存在：发布前会先删掉同名 Release + tag 再重建。
              echo "✅ ${VERSION} 是夜间构建，允许覆盖同名 Release"
              ;;
            *)
              # 版本 tag 不能已存在：重跑同一次发布会把 tag 挪到新提交上，
              # 历史 Release 的对比基准跟着变。确需补发先手动删掉旧 Release + tag。
              if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
                echo "::error::tag ${VERSION} 已存在，不能重复发布"
                echo "   已有指向: $(git rev-parse --short "${VERSION}")"
                echo "   当前 HEAD: $(git rev-parse --short HEAD)"
                echo "   确需重发：gh release delete ${VERSION} --yes --cleanup-tag，再重跑本工作流"
                exit 1
              fi
              echo "✅ tag ${VERSION} 不存在，可以发布"

              # 新版本必须比已有的正式版更新，否则正文里的 diff 是反的
              if [ "${PRERELEASE}" = "false" ]; then
                latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
                if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
                  echo "::error::版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
                  exit 1
                fi
                echo "✅ 比上一个正式版 ${latest:-（无）} 新"
              fi
              ;;
          esac

      # 下载表「说明」列由 scripts/ci/describe-artifact.sh 统一生成；发版前先把
      # 每个压缩包对应的文案打到日志，便于核对（正文里由 render-release-body.sh 渲染）。
      - name: 核对附件说明
        shell: bash
        run: |
          set -euo pipefail
          for f in release/*; do
            [ -f "${f}" ] || continue
            case "${f}" in
              *.tar.gz | *.zip) sh scripts/ci/describe-artifact.sh "$(basename "${f}")" ;;
            esac
          done

      # 正文与更新内容只有一份实现（scripts/ci/*.sh），CNB 那份也调用同样的脚本，
      # 避免两边各写一遍表格/标题/下载链接，改一处忘一处。
      - name: 生成 Release 正文
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
          REPO_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_full }}
          ARTIFACT_DIR: release
          ARTIFACT_LAYOUT: triplet # 本仓库是 backend/reporter/forwarder 三服务
          OUT_FILE: release_body.md
        run: |
          set -euo pipefail

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、nightly 对 nightly、
          # 正式版对正式版；首次发某渠道则回退到上一个正式版）。实现见 scripts/ci/release-changelog.sh。
          # GitHub 的提交路径是 /commit/<sha>，和 CNB 的 /-/commit 不同，前缀显式传
          CHANGELOG=$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}")
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效，
          # 本 step 里读不到，之前那样写 CHANGELOG 会是空的。
          export CHANGELOG

          sh scripts/ci/render-release-body.sh

      # 夜间构建同一天重跑/补发必须删掉同名 Release + tag 再重建：
      # 一是旧附件会一直堆在 Release 上，二是重建会刷新 published_at。
      # 正式版 / rc / beta / alpha 的 tag 不存在同名 Release（tag 已存在校验挡住），
      # 这一步是空操作。
      - name: 删除同名旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.interior_version }}
        shell: bash
        run: gh release delete "${VERSION}" --yes --cleanup-tag 2>/dev/null || true

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.interior_version }}
          name: ${{ needs.prepare.outputs.interior_release_title }}
          draft: false
          # 版本号带 rc/beta/alpha/nightly 才勾选预发布，正式版不勾
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          body_path: release_body.md
          files: release/*

      # 夜间构建每天一个 tag，只保留最近 3 个 Release（含 tag），更早的删掉：
      # 更新器只用最新一个，旧 nightly 没有升级价值（回滚应装正式版），
      # 留着只会让 Release 列表和存储无限增长。只清理 *-nightly.*，不碰正式版 / rc / beta / alpha。
      # 镜像平台（CNB / Gitee / GitLab / GitCode）的同步流水线在发布成功后各自做同样清理：
      # GitHub 这边的删除不会传播过去，各平台只能按自己的 Release 列表收敛到 3 个。
      # 清理是旁路：列表取不到、某个 Release 删不掉都只打警告，绝不让本 job 变红——
      # 发布本身已经成功，清理失败只是存储多一点，下一轮 nightly 还会再试。
      - name: 清理旧 nightly Release（只保留最近 3 个）
        if: ${{ contains(needs.prepare.outputs.interior_version, '-nightly.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 故意不用 set -e：清理里任何一步失败都只告警
          set -uo pipefail
          keep=3

          # gh release list 默认按创建时间倒序；只处理日期 nightly（tag 以 -nightly.YYYYMMDD 结尾），
          # rc / beta / alpha 不动。
          if ! list=$(gh release list --limit 100 --json tagName,isPrerelease \
                --jq '.[] | select(.isPrerelease) | .tagName | select(test("-nightly\\.[0-9]{8}$"))' 2>&1); then
            echo "⚠ 获取 Release 列表失败，跳过清理（不影响发布）："
            echo "$list"
            exit 0
          fi
          if [ -z "$list" ]; then
            echo "没有需要清理的旧 nightly Release"
            exit 0
          fi

          # 跳过最新 keep 个，其余逐个删除（连 tag 一起）；单个失败不影响其余
          printf '%s\n' "$list" | tail -n "+$((keep + 1))" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "删除旧 nightly Release: ${tag}"
            if gh release delete "${tag}" --yes --cleanup-tag; then
              echo "  ✓ 已删除 ${tag}"
            else
              echo "  ⚠ 删除失败（忽略）: ${tag}"
            fi
          done
          exit 0

  # GitHub Release 发布成功后，触发 CNB 同步构建（把同一版本发布到 CNB）。
  # 独立成 job：便于在其后追加 webhook 通知（notify job），也让「同步」与「发布」解耦。
  # 延迟 8 秒：等 GitHub CDN 把刚发布的附件同步好，避免 CNB 侧下载 404。
  # 注意：使用独立的 SYNC_CNB_TOKEN（仅 repo-cnb-trigger:rw 权限），
  # 与给软件升级下载用的 CNB_TOKEN（repo-release:rw）区分，互不干扰。
  sync-cnb:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    # token 必须放 job 级 env：step 自己的 env 在同一步骤的 if 求值时还读不到，
    # 放 step 级会让 if 恒为假、同步步骤被永远跳过（与 sync-gitlab / sync-gitcode 同口径）。
    env:
      SYNC_CNB_TOKEN: ${{ secrets.SYNC_CNB_TOKEN }}
    steps:
      - name: 触发 CNB 同步构建
        id: trigger
        if: ${{ env.SYNC_CNB_TOKEN != '' }}
        env:
          CNB_API_ENDPOINT: ${{ secrets.CNB_API_ENDPOINT || 'https://api.cnb.cool' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="${CNB_API_ENDPOINT%/}"
          REPO="dtapp/ip_vibe"
          EVENT="api_trigger_release"
          PRERELEASE="${{ needs.prepare.outputs.pre_release }}"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="同步预发布版 ${{ needs.prepare.outputs.interior_version }}"
          else
            TITLE="同步正式版 ${{ needs.prepare.outputs.interior_version }}"
          fi

          echo "触发 CNB 同步构建: ${API}/${REPO}/-/build/start (event=${EVENT})"
          HTTP=$(curl -s -o /tmp/cnb_start.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_CNB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -d "$(jq -n \
              --arg branch "master" \
              --arg event "$EVENT" \
              --arg title "$TITLE" \
              --arg version "${{ needs.prepare.outputs.interior_version }}" \
              --arg commit "${{ needs.prepare.outputs.commit_full }}" \
              '{branch: $branch, event: $event, title: $title, env: {version: $version, commit: $commit}}')" \
            "${API}/${REPO}/-/build/start")

          echo "CNB build/start 响应 HTTP=${HTTP}"
          cat /tmp/cnb_start.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 CNB 同步构建失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已成功请求 CNB 执行同步构建"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      # 触发步骤被跳过（未配置 secret）或中途失败时，也要给出一个确定的状态，
      # 否则 notify 里只能显示「未知」，分不清「没触发」和「触发了但失败」。
      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # GitHub Release 发布成功后，触发 Gitee Go 流水线（.workflow/release.yml），
  # 由它把 GitHub 资产搬到 Gitee Release 并把正文渲染成 HTML。
  # Gitee Go 没有「调 API 建 Release」的接口，但有 Webhook 触发：
  #   POST <触发地址>，Authorization: Bearer <个人令牌>，
  #   请求体 {"eventType": "...", "payload": {"params": {...}}}
  # eventType 必须逐字等于 .workflow/release.yml 里 triggers.webhook 配的名字（ip-vibe-release），
  # 两边改名要一起改。
  # secret：
  #   SYNC_GITEE_WEBHOOK_URL —— Gitee 流水线详情页给出的 Webhook 触发地址
  #   SYNC_GITEE_TOKEN       —— Gitee → 个人中心 → 私人令牌
  # 不配也不影响发版，只是 Gitee 那边需要手动点执行。
  sync-gitee:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    env:
      GITEE_WEBHOOK_URL: ${{ secrets.SYNC_GITEE_WEBHOOK_URL }}
      GITEE_TOKEN: ${{ secrets.SYNC_GITEE_TOKEN }}
    steps:
      - name: 触发 Gitee 发布流水线
        id: trigger
        if: ${{ env.GITEE_WEBHOOK_URL != '' && env.GITEE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          # VERSION 显式传过去，Gitee 端就不用再靠「取最新 Release」猜；
          # 万一 payload.params 不生效，那边的脚本会自己回落到 latest。
          # COMMIT 一起传：镜像出来的 Release 要指向「被发布的那个 commit」，
          # 而不是默认分支的最新代码（镜像仓库是 pull mirror，同步有延迟，
          # 那边探测不到这个 commit 时会退回默认分支）。
          # 只传 VERSION：是否预发布由版本号后缀判定（Gitee 侧的全局参数 PRERELEASE 已移除）。
          VERSION="${{ needs.prepare.outputs.interior_version }}"
          COMMIT="${{ needs.prepare.outputs.commit_full }}"
          echo "触发 Gitee 流水线: ${VERSION} (commit=${COMMIT})"

          HTTP=$(curl -s -o /tmp/gitee.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"eventType\":\"ip-vibe-release\",\"payload\":{\"params\":{\"VERSION\":\"${VERSION}\",\"COMMIT\":\"${COMMIT}\"}}}" \
            "${GITEE_WEBHOOK_URL}")

          echo "Gitee webhook 响应 HTTP=${HTTP}"
          cat /tmp/gitee.json || true
          if [ "${HTTP}" -lt 200 ] || [ "${HTTP}" -ge 300 ]; then
            echo "::warning::触发 Gitee 流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已请求 Gitee 执行发布流水线（异步执行，进度看 Gitee 流水线页面）"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # Release 发布成功后触发 GitLab 的 release job（.gitlab/workflows/release.yml，由 .gitlab-ci.yml
  # include；只在 CI_PIPELINE_SOURCE == "trigger" 时跑：下载 GitHub 资产 → 传 Generic Package → 建 GitLab Release）。
  # 用项目级 trigger token，只触发流水线、不绑用户。
  # 令牌：GitLab 项目 → Settings → CI/CD → Pipeline trigger tokens → Add new token（形如 glptt-xxx），
  # 创建后填到 GitHub 仓库 secret SYNC_GITLAB_TRIGGER_TOKEN。
  # 只传 VERSION：该 job 的 rules 只看 CI_PIPELINE_SOURCE 与 VERSION，
  # 预发布由版本号后缀判定，不再传 PRERELEASE。
  sync-gitlab:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITLAB_TRIGGER_TOKEN: ${{ secrets.SYNC_GITLAB_TRIGGER_TOKEN }}
    steps:
      - name: 触发 GitLab 同步流水线
        id: trigger
        if: ${{ env.GITLAB_TRIGGER_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://gitlab.com/api/v4"   # 自建 GitLab 实例改这里
          PROJECT="dtapps/ip_vibe"        # dtapps 带 s；GitCode / CNB 那边是 dtapp，别抄错
          REF="master"                      # 镜像仓库要构建的分支
          # 路径形式必须 URL 编码（/ → %2F）。
          PROJ=$(printf '%s' "$PROJECT" | jq -sRr @uri)

          echo "触发 GitLab 流水线: ${API}/projects/${PROJ}/trigger/pipeline (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitlab_trigger.json -w "%{http_code}" -X POST \
            --form "token=${GITLAB_TRIGGER_TOKEN}" \
            --form "ref=${REF}" \
            --form "variables[VERSION]=${{ needs.prepare.outputs.interior_version }}" \
            --form "variables[COMMIT]=${{ needs.prepare.outputs.commit_full }}" \
            "${API}/projects/${PROJ}/trigger/pipeline")

          echo "GitLab trigger/pipeline 响应 HTTP=${HTTP}"
          cat /tmp/gitlab_trigger.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitLab 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已成功请求 GitLab 执行同步流水线"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # Release 发布成功后 dispatch GitCode 的 release.yml（.gitcode/workflows/release.yml，
  # 逻辑：下载 GitHub 资产 → 建 GitCode Release → 逐个上传附件），须声明 on: workflow_dispatch。
  # 令牌：GitCode → 头像 → 个人设置 → 访问令牌 → 新建访问令牌（勾 repo 读写，令牌只显示一次），
  # 创建后填到 GitHub 仓库 secret SYNC_GITCODE_TOKEN（GitCode 侧的仓库密钥是另一份配置，
  # 与本 secret 值相同但要各填一次）。
  # access_token 按官方要求走 query，故日志不打印完整 URL。
  sync-gitcode:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # 供 notify job 在通知里展示同步状态
    outputs:
      status: ${{ steps.status.outputs.status }}
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITCODE_TOKEN: ${{ secrets.SYNC_GITCODE_TOKEN }}
    steps:
      - name: 触发 GitCode 同步流水线
        id: trigger
        if: ${{ env.GITCODE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://api.gitcode.com/api/v8"  # 私有化部署改这里
          REPO="dtapp/ip_vibe"                 # dtapp 不带 s，GitLab / Gitee 那边是 dtapps
          WORKFLOW="release.yml"               # .gitcode/workflows/ 下的文件名，也可填 workflow id
          REF="master"                         # 镜像仓库主分支（不是 main）
          echo "触发 GitCode workflow: ${REPO} / ${WORKFLOW} (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitcode_dispatch.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg ref "$REF" \
              --arg version "${{ needs.prepare.outputs.interior_version }}" \
              --arg commit "${{ needs.prepare.outputs.commit_full }}" \
              '{ref: $ref, inputs: {version: $version, commit: $commit}}')" \
            "${API}/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches?access_token=${GITCODE_TOKEN}")

          echo "GitCode dispatches 响应 HTTP=${HTTP}"
          cat /tmp/gitcode_dispatch.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitCode 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✓ 已成功请求 GitCode 执行同步流水线"
            echo "status=triggered" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录同步状态
        id: status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trigger.outcome }}" = "skipped" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.trigger.outputs.status }}" ]; then
            echo "status=${{ steps.trigger.outputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

  # 构建 / 发布 / 各镜像平台同步全部完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    # 等所有镜像同步 job 结束（未配置对应 secret 时它们只是跳过，不影响 success 判定）。
    needs: [sync-cnb, sync-gitee, sync-gitlab, sync-gitcode, release, prepare]
    runs-on: ubuntu-26.04
    if: ${{ needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          TAG="${{ needs.prepare.outputs.interior_version }}"
          BUILD_TIME="${{ needs.prepare.outputs.build_time }}"
          # 构建时间是 UTC ISO8601，转成北京时间展示更直观
          BUILD_TIME_CN=$(date -d "${BUILD_TIME}" -u +'%Y-%m-%d %H:%M:%S' 2>/dev/null)
          BUILD_TIME_CN="${BUILD_TIME_CN} (UTC+8)"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # 各镜像平台的 Release 页面（仓库路径各平台不同，别抄错）：
          #   CNB / GitCode → dtapp（不带 s）；Gitee / GitLab → dtapps（带 s）
          # URL 格式按各平台同步脚本的输出对齐：
          #   GitLab 是 /-/releases/<tag>（没有 /tag 这一段），其余是 /releases/tag/<tag>
          CNB_RELEASE_URL="https://cnb.cool/dtapp/ip_vibe/-/releases/tag/${TAG}"
          GITEE_RELEASE_URL="https://gitee.com/dtapps/ip_vibe/releases/tag/${TAG}"
          GITLAB_RELEASE_URL="https://gitlab.com/dtapps/ip_vibe/-/releases/${TAG}"
          GITCODE_RELEASE_URL="https://gitcode.com/dtapp/ip_vibe/releases/tag/${TAG}"

          # 同步状态 → 中文标签。状态来自各 sync job 的 outputs：
          #   triggered=已触发（异步执行，进度看平台页面）/ skipped=未配置 secret / failed=触发失败
          sync_state() {
            case "$1" in
              triggered) printf '✅ 已触发' ;;
              skipped) printf '⏭ 未配置（跳过）' ;;
              failed) printf '❌ 触发失败' ;;
              *) printf '❓ 未知' ;;
            esac
          }

          TITLE="IPVibe ${TAG} 构建完成"
          TAGS="IPVibe|stable"
          if [ "${{ needs.prepare.outputs.pre_release }}" = "true" ]; then
            TITLE="IPVibe ${TAG} (预发布) 构建完成"
            TAGS="IPVibe|prerelease"
          fi
          DESP="**版本**: \`${TAG}\`  "$'\n'
          DESP="${DESP}**构建时间**: ${BUILD_TIME_CN}  "$'\n'
          DESP="${DESP}**Git 提交**: ${{ needs.prepare.outputs.commit_short }}  "$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${RELEASE_URL})  "$'\n'
          DESP="${DESP}**CNB Release**: [${TAG}](${CNB_RELEASE_URL})  "$'\n'
          DESP="${DESP}**Gitee Release**: [${TAG}](${GITEE_RELEASE_URL})  "$'\n'
          DESP="${DESP}**GitLab Release**: [${TAG}](${GITLAB_RELEASE_URL})  "$'\n'
          DESP="${DESP}**GitCode Release**: [${TAG}](${GITCODE_RELEASE_URL})  "$'\n'
          DESP="${DESP}**镜像同步**: CNB $(sync_state "${{ needs['sync-cnb'].outputs.status }}") · Gitee $(sync_state "${{ needs['sync-gitee'].outputs.status }}") · GitLab $(sync_state "${{ needs['sync-gitlab'].outputs.status }}") · GitCode $(sync_state "${{ needs['sync-gitcode'].outputs.status }}")"

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              --arg tags "$TAGS" \
              '{title: $title, desp: $desp, tags: $tags}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
