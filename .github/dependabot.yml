version: 2

# 私有 registry 凭据（CNB 制品库需要认证后才能列出镜像标签）
registries:
  cnb-docker:
    type: 'docker-registry'
    url: 'https://docker.cnb.cool'
    username: 'cnb'
    password: ${{secrets.CNB_DOCKER_TOKEN}}

updates:
  # Go 依赖
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'go'

  # 前端依赖
  - package-ecosystem: 'npm'
    directory: '/cmd/frontend'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'frontend'

  # GitHub Actions 依赖（扫描 .github/workflows 下的第三方 action 版本）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'github-actions'

  # GitHub 镜像构建的 Dockerfile 基础镜像
  - package-ecosystem: 'docker'
    directory: '/.github/docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'

  # CNB 镜像构建的 Dockerfile 基础镜像
  - package-ecosystem: 'docker'
    directory: '/.cnb/docker'
    registries:
      - 'cnb-docker'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
      - 'docker'
