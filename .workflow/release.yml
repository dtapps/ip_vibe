# 从单一来源（DOWNLOAD_SOURCE=cnb|github）搬产物到 Gitee Release
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，GitHub / CNB / GitLab / GitCode 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   v1.2.3                   -> 同上（v 前缀可有可无，统一归一成 v1.2.3）
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#                               （各镜像平台同口径，同样只保留最近 3 个。）
#
# 本流水线做最小归一化：VERSION 为空时先调 gitee-release-download.js --resolve-tag 查
# 来源平台的最新 tag，再 source scripts/ci/resolve-prerelease.sh 按版本号后缀判预发布；
# 上游（GitHub Actions 的 prepare job）已把 nightly 展开成带日期的 tag，这里直接沿用。
#
# 实现拆成两个脚本（都在 scripts/ci/，可本地单独跑）：
#   1) gitee-release-download.js —— 按跳过规则下载产物到 assets/，写出清单 gitee-release.json
#      （清单里含 tag / 预发布 / 正文 HTML / 待上传文件列表）
#   2) gitee-release-publish.js  —— 读清单，建 Release 并逐个上传附件；
#      发布成功后清理过期 nightly（保留最近 3 个，与 GitHub 同口径）
#
# 为什么不用 release@gitee 插件：
#   - assertFiles 是静态清单，做不到「某个文件超 100MB 就跳过它」；
#   - 400 时响应体为空，看不到 Gitee 到底说了什么；
#   - 正文走 KEY=VALUE 参数：不能换行、不能有裸 =、整值会被当相对路径 open（>4096 字节直接崩）。
#
# 触发方式：
#   1) GitHub Actions 发完 Release 后 POST Webhook（event=ip-vibe-release）；
#   2) Gitee → 仓库 → 流水线 → 「发布版本」→ 执行（补发历史版本时手填 VERSION）。
#
# 前置条件（Gitee 流水线 → 设置 → 全局参数）：
#   - DOWNLOAD_SOURCE      可选，cnb（默认）/ github。**一次发布只认一个来源，绝不混用**：
#                          包里注入了 RepoSource，客户端据此选升级通道，混源等于随机分配
#   - VERSION              可选，留空先调 --resolve-tag 查来源平台最新 tag；带不带 v 都行
#                          （cnb 用匿名 git ls-remote --tags，github 用 /releases/latest）
#   - IPVIBE_GITHUB_TOKEN  可选，GitHub 只读令牌，避开 api.github.com 匿名限流
#   - IPVIBE_GITEE_TOKEN   必填，Gitee 个人令牌（repo 读写）
#
# 参数名不能以 GITEE_ 开头：该前缀由 Gitee 流水线自己占用（GITEE_PARAMS 等），
# 自定义参数用 GITEE_xxx 会被平台拒绝或覆盖，所以统一加 IPVIBE_ 前缀。
#
# 预发布没有开关：只按 VERSION 后缀（rc/beta/alpha/nightly）判定，不读平台上游的布尔字段。
version: '1.0'
name: release
displayName: 发布版本

triggers:
  # 只认 Webhook 自定义事件：本仓库是 GitHub 的镜像，配 push 会每次同步都发一版。
  trigger: auto
  webhook:
    - 'ip-vibe-release'

# 同一条流水线同时只跑一个：建 Release / 传附件 / 覆盖同名 tag 并发会互相踩。
strategy:
  blocking: true

# 引用仓库级「全局参数」；缺了这段脚本拿到的就是空值。
ref_variable:
  - DOWNLOAD_SOURCE
  - VERSION
  - COMMIT
  - IPVIBE_GITHUB_TOKEN
  - IPVIBE_GITEE_TOKEN

stages:
  - name: publish
    displayName: 下载并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 从单一来源搬资产并发布到 Gitee
        nodeVersion: 20.19.0
        commands:
          - |
            set -eu
            # 平台做的是**文本插值**，不是 shell 展开：必须写 ${VERSION} 的精确形式，
            # 写成 ${VERSION:-} 不匹配插值规则，会原样落进 shell。
            set +u
            export RELEASE_VERSION="${VERSION}"
            export RELEASE_COMMIT="${COMMIT}"
            export IPVIBE_GITHUB_TOKEN="${IPVIBE_GITHUB_TOKEN}"
            export IPVIBE_GITEE_TOKEN="${IPVIBE_GITEE_TOKEN}"
            export SOURCE_INPUT="${DOWNLOAD_SOURCE}"
            set -u

            # DOWNLOAD_SOURCE 归一化：cnb / github 原样（忽略大小写与空白），空 → cnb，
            # 其它值直接报错。一次发布只认一个来源：包里注入了 RepoSource，客户端据此
            # 选升级通道，混源等于把升级通道随机分配给用户。
            SOURCE_KEY="$(printf '%s' "${SOURCE_INPUT}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case "${SOURCE_KEY}" in
              ''|cnb)   export DOWNLOAD_SOURCE='cnb' ;;
              github)   export DOWNLOAD_SOURCE='github' ;;
              *) echo "错误：DOWNLOAD_SOURCE 只能是 cnb 或 github，收到 '${SOURCE_INPUT}'"; exit 1 ;;
            esac
            echo "DOWNLOAD_SOURCE=${DOWNLOAD_SOURCE}"

            # VERSION 为空：先调脚本只查最新 tag（不下载），再交给 resolve_version
            # 统一归一化并靠后缀判预发布；不要读 GitHub Release 的 prerelease 字段。
            if [ -z "$RELEASE_VERSION" ]; then
              RELEASE_VERSION="$(node scripts/ci/gitee-release-download.js --resolve-tag)" || exit 1
              if [ -z "$RELEASE_VERSION" ]; then
                echo "错误：--resolve-tag 没有返回版本号"
                exit 1
              fi
              echo "VERSION 为空：从 ${DOWNLOAD_SOURCE} 解析到最新 tag ${RELEASE_VERSION}"
            fi

            . scripts/ci/resolve-prerelease.sh
            resolve_version "$RELEASE_VERSION" || exit 1
            echo "$PRE_NOTE"
            export RELEASE_VERSION="${TAG}"
            export VERSION="${TAG}"
            export PRERELEASE="${PRERELEASE}"

            if [ -z "$RELEASE_COMMIT" ]; then
              echo "COMMIT 为空：Release 的 tag 将指向默认分支"
            fi
            if [ -z "$IPVIBE_GITEE_TOKEN" ]; then
              echo "错误：未配置全局参数 IPVIBE_GITEE_TOKEN（个人令牌，repo 读写）"
              exit 1
            fi

            # GitHub 与 CNB 都会触发这条 Gitee 流水线、传同一个 VERSION：谁先在 Gitee
            # 建出 Release 就算发布成功，后到的直接跳过，不再下载 18 个附件、也不把
            # 已发布的内容删掉重建。用 $CHECK_RC（不加花括号）避免被平台的文本插值吃掉。
            # 退出码 0=已存在 1=不存在 2=查询失败（查询失败必须报错，不能当成不存在）。
            echo "======== 0/2 检查 Gitee 是否已有 ${VERSION} ========"
            set +e
            node scripts/ci/gitee-release-publish.js --check-exists
            CHECK_RC=$?
            set -e
            case "$CHECK_RC" in
              0) echo "Gitee 已有 ${VERSION}，跳过本次同步"; exit 0 ;;
              1) echo "Gitee 尚无 ${VERSION}，继续下载发布" ;;
              *) echo "错误：查询 Gitee Release 失败（退出码 $CHECK_RC）" >&2; exit 1 ;;
            esac

            # 正文 markdown → HTML 有 marked 时用它（Gitee 前端是 markdown-it({html:true})），
            # 装不上时下载脚本自带极简渲染器兜底，不让 Gitee 发版卡在 npm 上。
            export npm_config_registry=https://registry.npmmirror.com
            npm install marked \
              --registry=https://registry.npmmirror.com --no-audit --no-fund --loglevel=error || true

            echo "======== 1/2 下载（来源 ${DOWNLOAD_SOURCE}，只跳过单文件 >100MB 的附件）========"
            node scripts/ci/gitee-release-download.js

            echo "======== 2/2 发布（建 Release + 逐个上传）========"
            node scripts/ci/gitee-release-publish.js
