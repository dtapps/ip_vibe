# GitLab 侧的流水线入口：只做一件事——把 GitHub Release 同步成 GitLab Release，
# 并在发布 nightly 时清理本平台过期的夜间构建（保留最近 3 个，与 GitHub 同口径）。
#
# 版本号规则见 .gitlab/workflows/release.yml 顶部（1.2.3 / 1.2.3-rc.1 / 1.2.3-nightly.20260101 …，
# 实现见 scripts/ci/resolve-prerelease.sh）；本平台不解析版本号，只镜像 GitHub 已发布的 tag。
#
# 目录约定与 GitHub 的 .github/workflows/ 对齐：本文件只放全局配置
# （stages / default / include），具体 job 按流水线拆到 .gitlab/workflows/ 下的单文件：
#   - .gitlab/workflows/release.yml —— 发布同步 + nightly 清理
# 新增流水线：加文件，再在下面的 include 里补一行。

stages:
  - release

default:
  # 不用自建 CI 镜像，改用公共镜像现装 curl / jq，省掉镜像构建与 Container Registry 依赖。
  #
  # ⚠️ 为什么必须是自带 bash 的镜像（trixie-slim）而不是 alpine + `apk add bash`：
  #   Runner 在容器起来后、跑 before_script **之前**就探测可用的 shell 并锁定（有 bash 用 bash，
  #   否则退回 sh）。在 before_script 里装 bash 改变不了已经选定的 shell —— 整个 script 仍由 ash
  #   执行，而脚本里有 bash 数组 `AUTH=(-H ...)`（ash 不支持数组，直接 syntax error）。
  #   所以 bash 必须在镜像里预装。
  image: debian:trixie-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl jq ca-certificates && rm -rf /var/lib/apt/lists/*
  interruptible: true

include:
  # local 路径相对仓库根，不能以 `/` 或 `./` 开头。
  # include 进来的 job 会继承上面的 default（镜像 / before_script），也能引用 stages。
  - local: .gitlab/workflows/release.yml
