services:
  backend:
    container_name: ip_vibe_backend
    image: docker.cnb.cool/dtapp/ip_vibe/backend:latest
    restart: unless-stopped
    network_mode: host
    healthcheck:
      # 检查 HTTP 路由是否返回 200 OK
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8086/health"] 
      interval: 5s # 每 5 秒检查一次
      timeout: 3s # 超时时间 3 秒
      retries: 3 # 失败 3 次后标记为 unhealthy
      start_period: 10s  # 在启动后的前 10 秒内，如果检查失败不算入重试次数
    environment:
      - "DEBUG=true"
      - "HTTP_PORT=8086"
      - "BASIC_AUTH_USERNAME=admin"
      - "BASIC_AUTH_PASSWORD=123456"
      - "DEVICE_CODE=设备编号，留空则自动生成（根据 /etc/machine-id 生成）"
      - "DEVICE_NAME=设备名称，可留空"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/data
      - ./logs:/app/logs

  reporter:
    container_name: ip_vibe_reporter
    image: docker.cnb.cool/dtapp/ip_vibe/reporter:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      - "DEBUG=true"
      - "HTTP_URL=http://127.0.0.1:8086"
      - "BASIC_AUTH_USERNAME=admin"
      - "BASIC_AUTH_PASSWORD=123456"
      - "DEVICE_CODE=设备编号，留空则自动生成（根据 /etc/machine-id 生成）"
      - "DEVICE_NAME=设备名称，可留空"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs

  forwarder:
    container_name: ip_vibe_forwarder
    image: docker.cnb.cool/dtapp/ip_vibe/forwarder:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      - "DEBUG=true"
      - "HTTP_URL=http://127.0.0.1:8086"
      - "BASIC_AUTH_USERNAME=admin"
      - "BASIC_AUTH_PASSWORD=123456"
      - "DEVICE_CODE=设备编号，留空则自动生成（根据 /etc/machine-id 生成）"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs