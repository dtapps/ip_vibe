services:
  forwarder:
    container_name: ip_vibe_forwarder
    image: docker.cnb.cool/dtapp/ip_vibe/forwarder:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - "DEBUG=true"
      - "HTTP_URL=http://ip_vibe:8086"
      - "BASIC_AUTH_USERNAME=admin"
      - "BASIC_AUTH_PASSWORD=123456"
      - "DEVICE_CODE=设备编号，留空则自动生成（根据 /etc/machine-id 生成）"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
