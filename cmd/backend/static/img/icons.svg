<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none">

  <!-- 加号 -->
  <symbol id="ip-plus" viewBox="0 0 48 48">
    <path d="M24 4v40M4 24h40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 删除 -->
  <symbol id="ip-delete" viewBox="0 0 48 48">
    <path d="M8 12h32M12 12l-2 28h26l-2-28M20 12V8h8v4m-14 8v14m8-14v14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 编辑 -->
  <symbol id="ip-edit" viewBox="0 0 48 48">
    <path d="M33.5 8l6 6L18 35H12v-6L33.5 8zM6 40h36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 实时IP -->
  <symbol id="ip-eyes" viewBox="0 0 48 48">
    <path d="M24 38c-11 0-20-8-20-8s9-8 20-8 20 8 20 8-9 8-20 8zm0-10a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 管理设备 -->
  <symbol id="ip-mobile" viewBox="0 0 48 48">
    <rect x="13" y="4" rx="4" width="22" height="40" stroke="currentColor" stroke-width="4"/>
    <rect x="17" y="32" width="14" height="2" rx="1" fill="currentColor"/>
  </symbol>

  <!-- 添加IP组 -->
  <symbol id="ip-folder-plus" viewBox="0 0 48 48">
    <path d="M44 38a2 2 0 01-2 2H6a2 2 0 01-2-2V14a2 2 0 012-2h14l4 4h18a2 2 0 012 2v18M24 22v8m-4-4h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 保存 -->
  <symbol id="ip-save" viewBox="0 0 48 48">
    <path d="M38 44H10a2 2 0 01-2-2V6a2 2 0 012-2h20l12 12v26a2 2 0 01-2 2zM34 14V6h-8M14 18h20m-20 8h20m-20 8h14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 取消 -->
  <symbol id="ip-close" viewBox="0 0 48 48">
    <path d="M36 12L12 36M12 12l24 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- 平台配置 -->
<symbol id="ip-server" viewBox="0 0 48 48">
  <rect x="6" y="10" width="36" height="28" rx="4" stroke="currentColor" stroke-width="4"/>
  <path d="M14 22h20m-20 8h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 记录管理 -->
<symbol id="ip-dns" viewBox="0 0 48 48">
  <path d="M24 4l16 10v16L24 40L8 30V14L24 4zM24 18v8m-6-4h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 操作日志 -->
<symbol id="ip-log" viewBox="0 0 48 48">
  <path d="M12 12h24m-24 8h20m-20 8h16m-16 8h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 设备实时上报 -->
<symbol id="ip-devices" viewBox="0 0 48 48">
  <rect x="4" y="14" rx="4" width="16" height="22" stroke="currentColor" stroke-width="4"/>
  <rect x="28" y="8" rx="4" width="16" height="28" stroke="currentColor" stroke-width="4"/>
</symbol>

<!-- IP 组 -->
<symbol id="ip-layer" viewBox="0 0 48 48">
  <path d="M4 12l20 8 20-8m-40 8l20 8 20-8m-40 8l20 8 20-8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 复制 -->
<symbol id="ip-copy" viewBox="0 0 48 48">
  <rect x="8" y="8" width="26" height="32" rx="4" stroke="currentColor" stroke-width="4"/>
  <path d="M20 20h16v16H20z" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 刷新 -->
<symbol id="ip-refresh" viewBox="0 0 48 48">
  <path d="M29 14l-8 8 8 8m-7-8h18c0-6-4-10-10-10s-10 4-10 10c0 6 4 10 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 复制成功 -->
<symbol id="ip-check" viewBox="0 0 48 48">
  <path d="M38 12L20 30l-8-8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 设备历史 -->
<symbol id="ip-history" viewBox="0 0 48 48">
  <path d="M24 4v12l8-8m-8 32V28l-8 8m16-16A16 16 0 1112 20h4a12 12 0 1012-12v-4z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 首页 / 仪表盘 -->
<symbol id="ip-home" viewBox="0 0 48 48">
  <path d="M8 20l16-12 16 12v20H8zM16 36v-8h16v8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 更多菜单 -->
<symbol id="ip-more" viewBox="0 0 48 48">
  <circle cx="12" cy="24" r="4" fill="currentColor"/><circle cx="24" cy="24" r="4" fill="currentColor"/><circle cx="36" cy="24" r="4" fill="currentColor"/>
</symbol>

<!-- 返回顶部 -->
<symbol id="ip-top" viewBox="0 0 48 48">
  <path d="M12 28l12-12 12 12M24 16v24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 调试 / Debug -->
<symbol id="ip-debug" viewBox="0 0 48 48">
  <path d="M20 4l-4 4-4-4m-8 8l4 4-4 4m24-16l4 4 4-4m8 8l-4 4 4 4M24 12v24m-8-8l8 8 8-8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 任务 / Task -->
<symbol id="ip-task" viewBox="0 0 48 48">
  <path d="M8 8h32v32H8zM16 16h16m-16 8h12m-12 8h16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 16l-8 8-4-4" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 启动 / Play -->
<symbol id="ip-play" viewBox="0 0 48 48">
  <path d="M12 8l24 16-24 16V8z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 暂停 / Pause -->
<symbol id="ip-pause" viewBox="0 0 48 48">
  <rect x="12" y="8" width="8" height="32" rx="2" stroke="currentColor" stroke-width="4"/>
  <rect x="28" y="8" width="8" height="32" rx="2" stroke="currentColor" stroke-width="4"/>
</symbol>

<!-- 停止 / Stop -->
<symbol id="ip-stop" viewBox="0 0 48 48">
  <rect x="12" y="12" width="24" height="24" rx="2" stroke="currentColor" stroke-width="4"/>
</symbol>

<!-- 运行 -->
<symbol id="ip-running" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 270" class="ip-ani-spin" fill="none"/>
  </symbol>

<!-- 端口转发 -->
<symbol id="ip-forward" viewBox="0 0 48 48">
  <path d="M8 24h12m-12 0l4-4m-4 4l4 4M28 24h12m-12 0l4-4m-4 4l4 4" 
        stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 通知管理（铃铛） -->
<symbol id="ip-bell" viewBox="0 0 48 48">
  <path d="M24 40a18 18 0 100-36m0 36v-4M14 20a6 6 0 0110 0m6 0a6 6 0 01-10 0" 
        stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 通知订阅（铃铛 + + 号，表示“订阅”动作） -->
<symbol id="ip-subscribe" viewBox="0 0 48 48">
  <path d="M24 40a18 18 0 100-36m0 36v-4M14 20a6 6 0 0110 0m6 0a6 6 0 01-10 0" 
        stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <path d="M34 32v6m-3-3h6" 
        stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- 检测 / 健康检查 -->
<!-- <symbol id="ip-health-check" viewBox="0 0 48 48">
  <path d="M24 44C12.95 44 4 35.05 4 24S12.95 4 24 4s20 8.95 20 20-8.95 20-20 20zm0-36C15.16 8 8 15.16 8 24s7.16 16 16 16 16-7.16 16-16S32.84 8 24 8z"
        fill="none" stroke="currentColor" stroke-width="4"/>
  <path d="M24 16v8l4 4" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol> -->

<!-- 检测 / 健康检查（轻量版） -->
<symbol id="ip-health-check" viewBox="0 0 48 48">
  <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M18 24l3 3 6-6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 测试 / 检查 -->
<symbol id="ip-test" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="4"/>
    <path d="M16 24l4 4 8-8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

<!-- 测试 / 实验室 -->
<symbol id="ip-lab" viewBox="0 0 48 48">
    <path d="M12 12h24v24H12zM20 8v8m8-8v8M16 32h16M24 20v12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="2.5" fill="currentColor" stroke="none"/>
  </symbol>

<!-- 添加测试 -->
<symbol id="ip-add-test" viewBox="0 0 48 48">
    <path d="M18 8v28a4 4 0 004 4h4a4 4 0 004-4V8M14 40h20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 36v-20M34 14v6m-3-3h6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

</svg>