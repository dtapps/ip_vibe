<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>{{ block "title" . }}DDNS管理平台{{ end }}</title>

  <link rel="stylesheet" href="/static/css/style.css">

  <script src="/static/js/api.js"></script>

  <script src="/static/libs/loadjs/loadjs.min.js"></script>
  <script src="/static/js/load.js"></script>
  {{ block "head" . }}{{ end }}
</head>

<body class="layout-body">
  {{ block "body" . }}{{ end }}

  <!-- 右边工具栏 -->
  <a href="javascript:location.reload()" class="float-btn btn-refresh" aria-label="刷新页面">
    {{ template "icons" (dict "Name" "i-lucide-refresh-cw" "Class" "w-5 h-5") }}
  </a>
  <a href="#" class="float-btn btn-top" aria-label="回到顶部">
    {{ template "icons" (dict "Name" "i-lucide-arrow-up-to-line" "Class" "w-5 h-5") }}
  </a>

  {{ block "scripts" . }}
  <script>
    window.isDebug = "{{isDebug}}" === "true";
    window.deviceCode = "{{selfDeviceCode}}";

    // 初始化日志静默
    if (!window.isDebug) {
      const noop = () => { };
      console.log = noop;
      console.info = noop;
      console.debug = noop;
      console.warn = noop;
      console.error = noop;
    }

    // 滚动超过 300 px 出现
    window.addEventListener("scroll", () => {
      // 回到顶部
      const topBtn = document.querySelector(".btn-top");
      if (topBtn) {
        topBtn.classList.toggle("visible", window.scrollY > 300);
      }
    });

    (async () => {
      try {
        // await loadJQuery();      // 先 jQuery
        // await loadSelect2();     // 然后 Select2
        await loadClipboardJS();   // 最后 ClipboardJS
        console.log('所有所需库加载完成');
      } catch (error) {
        console.error('库加载失败:', error.message);
      }
    })();
  </script>
  <script src="/static/js/index.js"></script>
  {{ end }}
</body>

</html>
