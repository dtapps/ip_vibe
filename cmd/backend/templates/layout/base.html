<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>{{ block "title" . }}DDNS管理平台{{ end }}</title>

  <link rel="preload" href="/static/libs/jquery/jquery.min.js" as="script" />
  <link rel="preload" href="/static/libs/select2/js/select2.min.js" as="script" />
  <link rel="preload" href="/static/libs/clipboard/clipboard.min.js" as="script" />
  <link rel="preload" href="/static/js/uuid.js" as="script" />
  <link rel="preload" href="/static/js/index.js" as="script" />

  <link rel="stylesheet" href="/static/css/style.css">

  <link href="/static/libs/select2/css/select2.min.css" rel="stylesheet" />
  {{ block "head" . }}{{ end }}
</head>

<body class="layout-body">
  {{ block "body" . }}{{ end }}

  <!-- 右边工具栏 -->
  <a href="javascript:location.reload()" class="float-btn btn-refresh" aria-label="刷新页面">
    {{ template "icons" (dict "Name" "i-lucide-refresh-cw" "Class" "w-5 h-5") }}
  </a>
  <a href="#" class="float-btn btn-top" aria-label="回到顶部">
    {{ template "icons" (dict "Name" "i-lucide-arrow-up-to-line" "Class" "w-5 h-5") }}
  </a>

  {{ block "scripts" . }}
  <script>
    window.isDebug = "{{isDebug}}" === "true";
    window.deviceCode = "{{selfDeviceCode}}";

    // 初始化日志静默
    if (!window.isDebug) {
      const noop = () => { };
      console.log = noop;
      console.info = noop;
      console.debug = noop;
      console.warn = noop;
      console.error = noop;
    }

    // 滚动超过 300 px 出现
    window.addEventListener("scroll", () => {
      // 回到顶部
      const topBtn = document.querySelector(".btn-top");
      if (topBtn) {
        topBtn.classList.toggle("visible", window.scrollY > 300);
      }
    });

  </script>
  <script src="/static/libs/jquery/jquery.min.js"></script>
  <script src="/static/libs/select2/js/select2.min.js"></script>
  <script src="/static/libs/clipboard/clipboard.min.js"></script>
  <script src="/static/js/uuid.js"></script>
  <script src="/static/js/index.js"></script>
  {{ end }}
</body>

</html>
