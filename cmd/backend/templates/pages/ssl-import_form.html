{{ define "pages/ssl-import_form.html" }}
<div id="addFormModal" class="modal">
    <div class="ui-modal-box">
        <div class="ui-header">
            <h3 class="text-xl font-bold">
                {{ template "icons" (dict "Name" "i-lucide-shield-check") }} <span id="modalTitle">添加 SSL 证书</span>
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('addFormModal')">
                {{ template "icons" (dict "Name" "i-lucide-x") }}
            </button>
        </div>

        <form id="addForm" class="p-8 space-y-5">

            <div class="ui-form-control">
                <label class="ui-label-text">域名 <span class="text-error">*</span></label>
                <input type="text" name="domain" id="domain" class="ui-input" required
                    placeholder="如 example.com, *.example.com 多个域名用逗号分隔" />
            </div>

            <div class="ui-form-control">
                <label class="ui-label-text">证书 <span class="text-error">*</span></label>
                <textarea name="certificate" id="certificate" class="ui-textarea" required placeholder="可选"></textarea>
            </div>

            <div class="ui-form-control">
                <label class="ui-label-text">私钥 <span class="text-error">*</span></label>
                <textarea name="private_key" id="private_key" class="ui-textarea" required placeholder="可选"></textarea>
            </div>

            <div class="modal-action gap-3">
                <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('addFormModal')">
                    {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
                </button>
                <button type="submit" class="btn-ui-primary">
                    {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
                </button>
            </div>
        </form>
    </div>
</div>

<div id="importFormModal" class="modal">
    <div class="ui-modal-box">
        <div class="ui-header">
            <h3 class="text-xl font-bold">
                {{ template "icons" (dict "Name" "i-lucide-shield-check") }} <span id="modalTitle">导入 SSL 记录</span>
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('importFormModal')">
                {{ template "icons" (dict "Name" "i-lucide-x") }}
            </button>
        </div>

        <form id="importForm" class="p-8 space-y-5">

            <div class="ui-form-control">
                <label class="ui-label-text">选择配置 <span class="text-error">*</span></label>
                <select name="config_id" id="config_id" class="ui-select" required
                    onchange="onConfigSelect(this)"></select>
            </div>

            <div class="ui-form-control">
                <label class="ui-label-text">域名 <span class="text-error">*</span></label>
                <input type="text" name="domain" id="domain" class="ui-input" required
                    placeholder="如 example.com, *.example.com 多个域名用逗号分隔" />
            </div>

            <input type="hidden" name="cert_private_key" id="cert_private_key" />
            <input type="hidden" name="cert_certificate" id="cert_certificate" />

            <div class="modal-action gap-3">
                <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('importFormModal')">
                    {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
                </button>
                <button type="submit" class="btn-ui-primary">
                    {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
