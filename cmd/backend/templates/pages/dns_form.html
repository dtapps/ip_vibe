{{ define "pages/dns_form.html" }}
<div id="formModal" class="modal">
  <div class="ui-modal-box">
    <div class="ui-header">
      <h3 class="text-xl font-bold">
        {{ template "icons" (dict "Name" "i-lucide-database-zap") }} <span id="modalTitle">添加 / 编辑 DNS 记录</span>
      </h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('formModal')">
        {{ template "icons" (dict "Name" "i-lucide-x") }}
      </button>
    </div>

    <form id="form" class="p-8 space-y-5">
      <div class="ui-form-control">
        <label class="ui-label-text">选择配置 <span class="text-error">*</span></label>
        <select name="config_id" id="config_id" class="ui-select" required onchange="onConfigSelect(this)"></select>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">子域名部分 <span class="text-error">*</span></label>
        <div class="flex items-center gap-2">
          <input type="text" name="sub_domain" id="sub_domain" class="ui-input" required
            placeholder="例如 www, blog, api" />
          <span id="domain_name" class="text-sm font-mono opacity-60"></span>
        </div>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">记录类型 <span class="text-error">*</span></label>
        <select name="type" id="type" class="ui-select" required onchange="onTypeSelect(this)">
          <option value="" disabled selected>请选择记录类型</option>
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
          <option value="CNAME">CNAME</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="ui-form-control">
          <label class="ui-label-text">IP 组 <span class="text-success">（二选一）</span></label>
          <select name="ip_group_id" id="ip_group_id" class="ui-select" disabled
            onchange="onIpGroupSelect(this)"></select>
        </div>

        <div class="ui-form-control">
          <label class="ui-label-text">CDN 记录 <span class="text-success">（二选一）</span></label>
          <select name="cdn_record_id" id="cdn_record_id" class="ui-select" disabled
            onchange="onCdnRecordSelect(this)"></select>
        </div>
      </div>

      <!-- 动态渲染 -->
      <div id="dynamic_fields_container" class="space-y-4"> </div>

      <div class="ui-form-control">
        <label class="ui-label-text">通知 (多选)</label>
        <select name="webhook_ids" id="webhook_ids" class="ui-select" multiple></select>
        <div class="ui-hint">选择需要接收此记录变动通知的 Webhook</div>
      </div>

      <input type="hidden" name="id" id="id" />
      <input type="hidden" name="platform" id="platform" />
      <input type="hidden" name="ip_group_code" id="ip_group_code" />
      <input type="hidden" name="config" id="config_json" />

      <div class="modal-action gap-3">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('formModal')">
          {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
        </button>
        <button type="submit" class="btn-ui-primary">
          {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
