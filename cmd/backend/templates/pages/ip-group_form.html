{{ define "pages/ip-group_form.html" }}
<div class="modal" id="ipGroupModal">
  <div class="modal-content">
    <h3 id="ipGroupModalTitle">添加 / 编辑 IP 组</h3>
    <form id="ipGroupForm">
      <div class="form-group">
        <label>组名 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="ip_group_name"
          required
          placeholder="如：CDN-边缘"
        />
      </div>

      <div class="form-group">
        <label>描述</label>
        <input
          type="text"
          name="description"
          id="ip_group_description"
          placeholder="可选"
        />
      </div>

      <div class="form-group">
        <label>选择设备（Ctrl/⌘ 多选） <span style="color: red">*</span></label>
        <select
          name="devices"
          id="ip_group_devices"
          required
          multiple
          onchange="onIpGroupDevicesSelect(this)"
          class="form-multiselect"
        ></select>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="ip_group_id" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('ipGroupModal')">
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-close" />
          </svg>
          取消
        </button>
        <button type="submit" class="btn btn-primary">
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-save" />
          </svg>
          保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
