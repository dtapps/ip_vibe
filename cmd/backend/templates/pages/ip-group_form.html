{{ define "pages/ip-group_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加 / 编辑 IP 组</h3>
    <form id="form">
      <div class="form-group">
        <label>组名 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="如：CDN-边缘"
        />
      </div>

      <div class="form-group">
        <label>描述</label>
        <input
          type="text"
          name="description"
          id="description"
          placeholder="可选"
        />
      </div>

      <div class="form-group">
        <label>选择设备（Ctrl/⌘ 多选） <span style="color: red">*</span></label>
        <select
          name="devices"
          id="devices"
          required
          multiple
          onchange="onDevicesSelect(this)"
          class="form-multiselect"
        ></select>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn btn-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
