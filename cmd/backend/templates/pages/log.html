{{ define "content" }}
<h1>🌐 DDNS管理平台</h1>

<div class="card" id="sectionLog">
  <div class="card-header">
    <h2 class="h2-icon">
      <svg class="ip-i">
        <use href="/static/img/icons.svg#ip-log"></use>
      </svg>
      操作日志
    </h2>
  </div>
  <div class="card-body">
    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>操作类型</th>
          <th>对象类型</th>
          <th>对象ID</th>
          <th>详情</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody id="table">
        {{ range .List }}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.OpType}}</td>
          <td>{{.ObjType}}</td>
          <td>{{.ObjID}}</td>
          <td>{{.Message}}</td>
          <td>{{ formatTimeOrNil .CreatedAt }}</td>
        </tr>
        {{ end }}
      </tbody>
    </table>
    <!-- 分页 -->
    {{ template "pagination" . }}
  </div>
</div>

<script src="/static/js/log.js"></script>
{{ end }}
