{{ define "pages/device_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加设备</h3>
    <form id="form">
      <div class="form-group">
        <label>编号 <span style="color: red">*</span></label>
        <input
          type="text"
          name="code"
          id="code"
          required
          placeholder="如: xxxx-x-x-x-xxxx"
        />
      </div>
      <div class="form-group">
        <label>名称 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="如: 我的"
        />
      </div>
      <div class="form-group">
        <label>IP地址V4</label>
        <input
          type="text"
          name="ip_v4"
          id="ip_v4"
          placeholder="如: 192.168.1.1"
        />
      </div>
      <div class="form-group">
        <label>IP地址V6</label>
        <input
          type="text"
          name="ip_v6"
          id="ip_v6"
          placeholder="如: 2001:0db8:85a3:0000:0000:8a2e:0370:7334"
        />
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn btn-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
