{{ define "pages/port-forward_form.html" }}
<div id="formModal" class="modal">
  <div class="ui-modal-box">
    <div class="ui-header">
      <h3 class="text-xl font-bold">
        {{ template "icons" (dict "Name" "ip-forward") }} <span id="modalTitle">添加 / 编辑 端口转发</span>
      </h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('formModal')">
        {{ template "icons" (dict "Name" "ip-close") }}
      </button>
    </div>

    <form id="form" class="p-8 space-y-5">
      <div class="ui-form-control">
        <label class="ui-label-text">名称 <span class="text-error">*</span></label>
        <input type="text" name="name" id="name" class="ui-input" required placeholder="如: 我的端口转发" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">描述</label>
        <textarea name="description" id="description" class="ui-textarea" placeholder="可选"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="ui-form-control">
          <label class="ui-label-text">本地监听端口 <span class="text-error">*</span></label>
          <input type="number" name="local_port" id="local_port" class="ui-input" required placeholder="如：8080" />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">远程目标端口 <span class="text-error">*</span></label>
          <input type="number" name="remote_port" id="remote_port" class="ui-input" required placeholder="如：80" />
        </div>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">远程目标主机 <span class="text-error">*</span></label>
        <input type="text" name="remote_host" id="remote_host" class="ui-input" required
          placeholder="如：192.168.1.100" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">选择协议（Ctrl/⌘ 多选） <span class="text-error">*</span></label>
        <select name="protocols" id="protocols" class="ui-select" required multiple
          onchange="onProtocolsSelect(this)"></select>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">选择设备 <span class="text-error">*</span></label>
        <select name="device_id" id="device_id" class="ui-select" required onchange="onDeviceIdSelect(this)"></select>
      </div>

      <input type="hidden" name="id" id="id" />

      <div class="modal-action gap-3">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('formModal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn-ui-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
