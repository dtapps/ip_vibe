{{ define "pages/cloudflare-tunnel_form.html" }}
<div id="ingressFormModal" class="modal">
    <div class="ui-modal-box">
        <div class="ui-header">
            <h3 class="text-xl font-bold">
                {{ template "icons" (dict "Name" "i-lucide-database-zap") }} <span id="modalTitle">添加 / 编辑 DNS 记录</span>
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('ingressFormModal')">
                {{ template "icons" (dict "Name" "i-lucide-x") }}
            </button>
        </div>

        <form id="ingressForm" class="ui-form-container">

            <div class="grid grid-cols-3 gap-4">
                <div class="ui-form-control">
                    <label class="ui-label-text">子域 <span class="text-error">*</span></label>
                    <div class="flex items-center gap-2">
                        <input type="text" name="sub_domain" class="ui-input" required placeholder="例如 www, @" />
                    </div>
                </div>

                <div class="ui-form-control">
                    <label class="ui-label-text">域名 <span class="text-error">*</span></label>
                    <select name="domain_name" class="ui-select" required onchange="onDomainNameSelect(this)"></select>
                </div>

                <div class="ui-form-control">
                    <label class="ui-label-text">路径 </label>
                    <div class="flex items-center gap-2">
                        <input type="text" name="domain_path" class="ui-input" placeholder="例如 /api, /blog" />
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-4 items-end">
                <div class="ui-form-control col-span-4">
                    <label class="ui-label-text">服务类型 <span class="text-error">*</span></label>
                    <select name="service_type" class="ui-select" required onchange="onServeTypeSelect(this)">
                        <option value="" disabled selected>选择类型</option>
                        <option value="http">HTTP</option>
                        <option value="https">HTTPS</option>
                        <option value="unix">UNIX</option>
                        <option value="tcp">TCP</option>
                        <option value="ssh">SSH</option>
                        <option value="rdp">RDP</option>
                        <option value="unix_tls">UNIX+TLS</option>
                        <option value="smb">SMB</option>
                        <option value="http_status">HTTP_STATUS</option>
                        <option value="bastion">BASTION</option>
                    </select>
                </div>

                <div class="col-span-1 pb-3 text-center opacity-30 font-black italic">
                    <span id="service_protocol">://</span>
                </div>

                <div class="ui-form-control col-span-7" id="service_content_input">
                    <label class="ui-label-text" id="service_content_label">URI <span
                            class="text-error">*</span></label>
                    <input type="text" name="service_content" class="ui-input" placeholder="例如 127.0.0.1:8080" />
                </div>
            </div>

            <input type="hidden" name="config_id" />
            <input type="hidden" name="tunnel_id" />
            <input type="hidden" name="ingress_id" />

            <div class="modal-action gap-3">
                <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('ingressFormModal')">
                    {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
                </button>
                <button type="submit" class="btn-ui-primary">
                    {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
                </button>
            </div>

        </form>
    </div>
</div>

<script>

    /**
     * 域名选择事件
     * @param {*} el 触发事件的元素
     * @returns
     */
    function onDomainNameSelect(el) {
        const domain_name = el.value;
        const zone_id = el.options[el.selectedIndex].dataset.zone_id;
        const zone_name = el.options[el.selectedIndex].dataset.zone_name;
    }

    /**
     * 服务类型选择事件
     * @param {*} el 触发事件的元素
     * @returns
     */
    function onServeTypeSelect(el) {
        const service_type = el.value;

        // 根据服务类型构建服务协议
        IngressUtil.buildServiceProtocol(
            service_type,
        );
    }

    /**
     * 打开入站规则表单弹窗
     * @param {*} el 触发事件的元素
     * @returns
     */
    async function openIngressFormModal(el) {
        const ingressForm = document.getElementById("ingressForm");
        if (!ingressForm) {
            throw new Error("未找到表单");
        }

        // 重置表单
        ingressForm.reset();

        try {
            const {
                configId,
                tunnelId,
                ingressId,
            } = el.dataset;

            // 验证必要参数
            if (!configId || !tunnelId) {
                return;
            }

            // 表单elements集合
            const els = ingressForm.elements;

            // 域名列表
            const { data: domainList } = await API.get(`/api/cloudflares/${configId}/domain`);
            console.log("domainList", domainList);
            if (domainList) {
                const domainNameSelect = els.domain_name;
                domainNameSelect.innerHTML = "";
                addPlaceholder(domainNameSelect, "请选择域名");
                domainList.forEach((d) => {
                    const opt = document.createElement("option");
                    opt.dataset.zone_id = d.zone_id;
                    opt.dataset.zone_name = d.zone_name;
                    opt.value = d.zone_name;
                    opt.text = `${d.zone_name}`;
                    domainNameSelect.appendChild(opt);
                });
            }


            // 配置ID
            els.config_id.value = configId;

            // 隧道ID
            els.tunnel_id.value = tunnelId;

            // 入站规则ID
            els.ingress_id.value = ingressId || 0;

            if (isNaN(ingressId) || ingressId <= 0) {
                showModal("ingressFormModal", "modalTitle", "添加 入站规则");
            } else {
                // 获取并解析数据
                if (!el.dataset.detail) {
                    throw new Error("未找到数据");
                }
                const d = JSON.parse(el.dataset.detail);

                // 解析 Hostname 和 Service
                const parseRemoteData = IngressUtil.parseRemoteData(d.hostname, d.service, domainList);

                // 子域
                els.sub_domain.value = parseRemoteData.sub_domain;

                // 域名
                els.domain_name.value = parseRemoteData.domain_name;

                // 路径
                els.domain_path.value = d.path;

                // 服务类型
                els.service_type.value = parseRemoteData.service_type;

                // URI
                els.service_content.value = parseRemoteData.service_content;


                // 根据服务类型构建服务协议
                IngressUtil.buildServiceProtocol(
                    parseRemoteData.service_type,
                );

                showModal("ingressFormModal", "modalTitle", "编辑 入站规则");
            }

        } catch (err) {
            alert(`打开失败: ${err.message}`);
            console.error(err);
            return;
        }
    }

    // 入站规则表单提交
    const ingressForm = document.getElementById("ingressForm");
    if (ingressForm) {
        ingressForm.onsubmit = async (e) => {
            try {
                // 阻止事件默认行为
                e.preventDefault();

                // 表单elements集合
                const els = ingressForm.elements;

                const configId = Number(els.config_id.value.trim());
                const tunnelId = Number(els.tunnel_id.value.trim());
                const ingressId = Number(els.ingress_id.value.trim());

                // 验证必要参数
                if (!configId || !tunnelId) {
                    return;
                }

                // 表单数据
                const form_data = {
                    sub_domain: els.sub_domain.value.trim(),
                    domain_name: els.domain_name.value.trim(),
                    domain_path: els.domain_path.value.trim(),
                    service_type: els.service_type.value.trim(),
                    service_content: els.service_content.value.trim(),
                };
                console.log("form_data", form_data);

                // 校验
                if (!form_data.sub_domain) {
                    return alert("请输入子域");
                }
                if (!form_data.domain_name) {
                    return alert("请选择域名");
                }
                if (!form_data.service_type) {
                    return alert("请选择服务类型");
                }

                if (isNaN(ingressId) || ingressId <= 0) {
                    // 调用 创建Cloudflare隧道入站配置
                    await API.post(`/api/cloudflare-tunnels/${tunnelId}/ingress`, form_data);
                } else {
                    // 调用 更新Cloudflare隧道入站配置
                    await API.patch(`/api/cloudflare-tunnels/${tunnelId}/ingress/${ingressId}`, form_data);
                }

                // 处理同步
                handleSync({
                    dataset: {
                        type: "this-tunnel",
                        configId: configId,
                        tunnelId: tunnelId,
                    }
                })

                // 刷新页面
                location.reload();
            } catch (err) {
                alert(`操作失败: ${err.message}`);
                console.error(err);
                return;
            }
        };
    }

</script>
{{ end }}
