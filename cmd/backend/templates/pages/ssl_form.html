{{ define "pages/ssl_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加 SSL 记录</h3>
    <form id="form">
      <div class="form-group">
        <label>选择配置 <span style="color: red">*</span></label>
        <select name="config_id" id="config_id" required onchange="onConfigSelect(this)"></select>
      </div>

      <div class="form-group">
        <label>域名 <span style="color: red">*</span></label>
        <input type="text" name="domain" id="domain" required
          placeholder="如 example.com, *.example.com 多个域名之间用逗号分隔（多个域名只能是同一个）" />
      </div>

      <div class="form-group">
        <label>证书提供方 <span style="color: red">*</span></label>
        <select name="provider" id="provider" required onchange="onProviderSelect(this)">
          <option value="letsencrypt">Let's Encrypt</option>
        </select>
      </div>

      <div class="form-group">
        <label>通知 (多选)</label>
        <select name="webhook_ids" id="webhook_ids" multiple></select>
        <small class="text-secondary">选择需要接收此记录变动通知的 Webhook</small>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn btn-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
