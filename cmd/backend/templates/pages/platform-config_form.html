{{ define "pages/platform-config_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加平台配置</h3>
    <form id="form">
      <div class="form-group">
        <label>服务能力 <span style="color: red">*</span></label>
        <select
          name="capability"
          id="capability"
          required
          onchange="changeCapability(this)"
        >
          <option value="all" selected>CDN + DNS</option>
          <option value="cdn">仅 CDN</option>
          <option value="dns">仅 DNS</option>
        </select>
      </div>

      <div class="form-group">
        <label>配置名称 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="如: 我的EdgeOne"
        />
      </div>

      <div class="form-group">
        <label>平台类型 <span style="color: red">*</span></label>
        <select
          name="platform"
          id="platform"
          required
          onchange="changePlatform(this.value)"
        >
          <option value="" disabled selected>请选择平台</option>
          <option value="edgeone">Tencent EdgeOne</option>
          <option value="cloudflare">CloudFlare</option>
          <option value="dnspod">DNSPod</option>
        </select>
      </div>

      <!-- EdgeOne 字段 -->
      <div id="edgeoneFields" class="platform-fields hidden">
        <h4 style="margin-bottom: 16px">EdgeOne 配置</h4>
        <div class="form-group">
          <label>Secret ID <span style="color: red">*</span></label>
          <input
            type="text"
            id="edgeone_secret_id"
            placeholder="AKIDxxxxxxxxxxxxxxxxxxxxxxxxx"
          />
        </div>
        <div class="form-group">
          <label>Secret Key <span style="color: red">*</span></label>
          <div class="input-group">
            <input
              type="password"
              id="edgeone_secret_key"
              placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePasswordVisibility('edgeone_secret_key', this)"
              title="显示/隐藏 Secret Key"
            >
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Zone ID <span style="color: red">*</span></label>
          <input type="text" id="edgeone_zone_id" placeholder="zone-xxxxxxxx" />
        </div>
        <div class="form-group">
          <label>Domain Name <span style="color: red">*</span></label>
          <input
            type="text"
            id="edgeone_domain_name"
            placeholder="your-domain.com"
          />
        </div>
      </div>

      <!-- CloudFlare 字段 -->
      <div id="cloudflareFields" class="platform-fields hidden">
        <h4 style="margin-bottom: 16px">CloudFlare 配置</h4>
        <div class="form-group">
          <label>API Token <span style="color: red">*</span></label>
          <div class="input-group">
            <input
              type="password"
              id="cloudflare_api_key"
              placeholder="your-api-token"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePasswordVisibility('cloudflare_api_key', this)"
              title="显示/隐藏 API Token"
            >
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Zone ID <span style="color: red">*</span></label>
          <input
            type="text"
            id="cloudflare_zone_id"
            placeholder="your-zone-id"
          />
        </div>
        <div class="form-group">
          <label>Domain Name <span style="color: red">*</span></label>
          <input
            type="text"
            id="cloudflare_domain_name"
            placeholder="your-domain.com"
          />
        </div>
      </div>

      <!-- DNSPod 字段 -->
      <div id="dnspodFields" class="platform-fields hidden">
        <h4 style="margin-bottom: 16px">DNSPod 配置</h4>
        <div class="form-group">
          <label>Secret ID <span style="color: red">*</span></label>
          <input
            type="text"
            id="dnspod_secret_id"
            placeholder="AKIDxxxxxxxxxxxxxxxxxxxxxxxxx"
          />
        </div>
        <div class="form-group">
          <label>Secret Key <span style="color: red">*</span></label>
          <div class="input-group">
            <input
              type="password"
              id="dnspod_secret_key"
              placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePasswordVisibility('dnspod_secret_key', this)"
              title="显示/隐藏 Secret Key"
            >
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Domain Name <span style="color: red">*</span></label>
          <input
            type="text"
            id="dnspod_domain_name"
            placeholder="your-domain.com"
          />
        </div>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />
      <input type="hidden" name="config" id="config_json" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn btn-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  /**
   * 切换密码输入框的可见性
   * @param {string} inputId - 输入框的 ID
   * @param {HTMLElement} buttonElement - 触发此函数的按钮元素 (this)
   */
  function togglePasswordVisibility(inputId, buttonElement) {
    const input = document.getElementById(inputId);
    if (!input) return;

    // 1. 检查当前状态并切换输入框类型
    if (input.type === "password") {
      input.type = "text";
      // 2. 切换图标到 '隐藏' 状态 (ip-close)
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-close") }}`;
      buttonElement.title = "隐藏 Secret";
    } else {
      input.type = "password";
      // 3. 切换图标到 '显示' 状态 (ip-eyes)
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-eyes") }}`;
      buttonElement.title = "显示 Secret";
    }
  }
</script>
{{ end }}
