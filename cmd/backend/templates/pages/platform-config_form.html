{{ define "pages/platform-config_form.html" }}
<div id="formModal" class="modal">
  <div class="ui-modal-box">
    <div class="ui-header">
      <h3 class="text-xl font-bold">
        {{ template "icons" (dict "Name" "i-lucide-server-cog") }} <span id="modalTitle">添加 / 编辑 平台配置</span>
      </h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('formModal')">
        {{ template "icons" (dict "Name" "i-lucide-x") }}
      </button>
    </div>

    <form id="form" class="p-8 space-y-5 max-h-[75vh] overflow-y-auto">
      <div class="ui-form-control">
        <label class="ui-label-text">服务能力 <span class="text-error">*</span></label>
        <select name="capability" id="capability" class="ui-select" required onchange="changeCapability(this)">
          <option value="all" selected>全部</option>
          <option value="cdn">仅 CDN</option>
          <option value="dns">仅 DNS</option>
          <option value="ssl">仅 SSL</option>
        </select>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">配置名称 <span class="text-error">*</span></label>
        <input type="text" name="name" id="name" class="ui-input" required placeholder="如: 我的配置" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">平台类型 <span class="text-error">*</span></label>
        <select name="platform" id="platform" class="ui-select" required onchange="changePlatform(this)">
          <option value="" disabled selected>请选择平台</option>
          <option value="cloudflare">CloudFlare</option>
          <option value="tencent_dns">腾讯云 DNS</option>
          <option value="tencent_cdn">腾讯云 CDN</option>
          <option value="tencent_eo">腾讯云 EdgeOne</option>
          <option value="aliyun_dns">阿里云 DNS</option>
          <option value="aliyun_cdn">阿里云 CDN</option>
          <option value="aliyun_esa">阿里云 ESA</option>
          <option value="baidu_dns">百度云 DNS</option>
          <option value="baidu_cdn">百度云 CDN</option>
          <option value="huawei_dns">华为云 DNS</option>
          <option value="huawei_cdn">华为云 CDN</option>
          <option value="volcengine_dns">火山引擎 DNS</option>
          <!-- <option value="qiniu_cdn">七牛云 CDN</option> -->
          <!-- <option value="upyun_cdn">又拍云 CDN</option> -->
          <!-- <option value="jdcloud_cdn">京东云 CDN</option> -->
          <!-- <option value="ksyun_cdn">金山云 CDN</option> -->
        </select>
      </div>

      <!-- 动态渲染 -->
      <div id="dynamic_fields_container" class="space-y-4"> </div>

      <input type="hidden" name="id" id="id" />
      <input type="hidden" name="config_json" id="config_json" />
      <input type="hidden" name="original_config_json" id="original_config_json" />

      <div class="modal-action gap-3">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('formModal')">
          {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
        </button>
        <button type="submit" class="btn-ui-primary">
          {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>

{{ end }}
