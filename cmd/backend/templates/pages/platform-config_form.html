{{ define "pages/platform-config_form.html" }}
<style>
  .hidden {
    display: none !important;
  }

  .field-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .input-group {
    position: relative;
    display: flex;
    align-items: center;
  }

  .toggle-password {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    margin-left: 8px;
    color: #666;
  }

  .toggle-password:hover {
    color: #333;
  }
</style>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加平台配置</h3>
    <form id="form">
      <div class="form-group">
        <label>服务能力 <span style="color: red">*</span></label>
        <select
          name="capability"
          id="capability"
          required
          onchange="changeCapability(this)"
        >
          <option value="all" selected>全部</option>
          <option value="cdn">仅 CDN</option>
          <option value="dns">仅 DNS</option>
          <option value="ssl">仅 SSL</option>
        </select>
      </div>

      <div class="form-group">
        <label>配置名称 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="如: 我的EdgeOne"
        />
      </div>

      <div class="form-group">
        <label>平台类型 <span style="color: red">*</span></label>
        <select
          name="platform"
          id="platform"
          required
          onchange="changePlatform(this.value)"
        >
          <option value="" disabled selected>请选择平台</option>
          <option value="cloudflare">CloudFlare</option>
          <option value="tencent_dns">腾讯云 DNS</option>
          <option value="tencent_eo">腾讯云 EdgeOne</option>
          <option value="aliyun_dns">阿里云 DNS</option>
          <option value="aliyun_esa">阿里云 ESA</option>
          <option value="baidu_dns">百度云 DNS</option>
          <option value="huawei_dns">华为云 DNS</option>
        </select>
      </div>

      <!-- CloudFlare 字段 -->
      <div id="cloudflare_fields" class="platform-fields hidden">
        <h4 style="margin-bottom: 16px">CloudFlare 配置</h4>
        <div class="form-group">
          <label>API Token <span style="color: red">*</span></label>
          <div class="input-group">
            <input
              type="password"
              id="cloudflare_api_key"
              placeholder="your-api-token"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePasswordVisibility('cloudflare_api_key', this)"
              title="显示/隐藏 API Token"
            >
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Zone ID <span style="color: red">*</span></label>
          <input
            type="text"
            id="cloudflare_zone_id"
            placeholder="your-zone-id"
          />
        </div>
        <div
          class="form-group domain-or-email-group"
          data-platform="cloudflare"
        >
          <label class="field-label" data-type="domain"
            >Domain Name <span style="color: red">*</span></label
          >
          <input
            type="text"
            id="cloudflare_domain_name"
            class="field-input domain-field"
            placeholder="your-domain.com"
            data-type="domain"
          />
          <label class="field-label hidden" data-type="email"
            >Email <span style="color: red">*</span></label
          >
          <input
            type="email"
            id="cloudflare_email"
            class="field-input email-field hidden"
            placeholder="your-email@example.com"
            data-type="email"
          />
        </div>
      </div>

<script>
  /**
   * 切换密码输入框的可见性
   * @param {string} inputId - 输入框的 ID
   * @param {HTMLElement} buttonElement - 触发此函数的按钮元素 (this)
   */
  function togglePasswordVisibility(inputId, buttonElement) {
    const input = document.getElementById(inputId);
    if (!input) return;

    // 1. 检查当前状态并切换输入框类型
    if (input.type === "password") {
      input.type = "text";
      // 2. 切换图标到 '隐藏' 状态 (ip-close)
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-close") }}`;
      buttonElement.title = "隐藏 Secret";
    } else {
      input.type = "password";
      // 3. 切换图标到 '显示' 状态 (ip-eyes)
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-eyes") }}`;
      buttonElement.title = "显示 Secret";
    }
  }
</script>
