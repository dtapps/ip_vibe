{{ define "pages/platform-config_form.html" }}
<div id="formModal" class="modal">
  <div class="ui-modal-box">
    <div class="ui-header">
      <h3 class="text-xl font-bold">
        {{ template "icons" (dict "Name" "ip-server") }} <span id="modalTitle">添加 / 编辑 平台配置</span>
      </h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('formModal')">
        {{ template "icons" (dict "Name" "ip-close") }}
      </button>
    </div>

    <form id="form" class="p-8 space-y-5 max-h-[75vh] overflow-y-auto">
      <div class="ui-form-control">
        <label class="ui-label-text">服务能力 <span class="text-error">*</span></label>
        <select name="capability" id="capability" class="ui-select" required onchange="changeCapability(this)">
          <option value="all" selected>全部</option>
          <option value="cdn">仅 CDN</option>
          <option value="dns">仅 DNS</option>
          <option value="ssl">仅 SSL</option>
        </select>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">配置名称 <span class="text-error">*</span></label>
        <input type="text" name="name" id="name" class="ui-input" required placeholder="如: 我的配置" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">平台类型 <span class="text-error">*</span></label>
        <select name="platform" id="platform" class="ui-select" required onchange="changePlatform(this.value)">
          <option value="" disabled selected>请选择平台</option>
          <option value="cloudflare">CloudFlare</option>
          <option value="tencent_dns">腾讯云 DNS</option>
          <option value="tencent_eo">腾讯云 EdgeOne</option>
          <option value="aliyun_dns">阿里云 DNS</option>
          <option value="aliyun_esa">阿里云 ESA</option>
          <option value="baidu_dns">百度云 DNS</option>
          <option value="huawei_dns">华为云 DNS</option>
        </select>
      </div>

      <div id="cloudflare_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">CloudFlare 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">API Token <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="cloudflare_api_key" class="ui-input" placeholder="your-api-token"
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('cloudflare_api_key', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Zone ID <span class="text-error">*</span></label>
          <input type="text" id="cloudflare_zone_id" class="ui-input" placeholder="your-zone-id" />
        </div>
        <div class="form-group domain-or-email-group" data-platform="cloudflare">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="cloudflare_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="cloudflare_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <div id="tencent_dns_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">腾讯云 DNS 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret ID <span class="text-error">*</span></label>
          <input type="text" id="tencent_dns_secret_id" class="ui-input" placeholder="AKID..." />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret Key <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="tencent_dns_secret_key" class="ui-input" placeholder="Secret Key..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('tencent_dns_secret_key', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group domain-or-email-group" data-platform="tencent_dns">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="tencent_dns_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="tencent_dns_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <div id="tencent_eo_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">腾讯云 EdgeOne 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret ID <span class="text-error">*</span></label>
          <input type="text" id="tencent_eo_secret_id" class="ui-input" placeholder="AKID..." />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret Key <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="tencent_eo_secret_key" class="ui-input" placeholder="Secret Key..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('tencent_eo_secret_key', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Zone ID <span class="text-error">*</span></label>
          <input type="text" id="tencent_eo_zone_id" class="ui-input" placeholder="zone-..." />
        </div>
        <div class="form-group domain-or-email-group" data-platform="tencent_eo">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="tencent_eo_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="tencent_eo_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <div id="aliyun_dns_fields" class="platform-fields hidden space-y-4">

        <div class="ui-form-control">

        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Access Key Secret <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="aliyun_dns_access_key_secret" class="ui-input" placeholder="Secret..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('aliyun_dns_access_key_secret', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group domain-or-email-group" data-platform="aliyun_dns">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="aliyun_dns_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="aliyun_dns_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <div id="aliyun_esa_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">阿里云 ESA 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">Access Key ID <span class="text-error">*</span></label>
          <input type="text" id="aliyun_esa_access_key_id" class="ui-input" placeholder="AKID..." />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Access Key Secret <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="aliyun_esa_access_key_secret" class="ui-input" placeholder="Secret..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('aliyun_esa_access_key_secret', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Site ID <span class="text-error">*</span></label>
          <input type="number" id="aliyun_esa_site_id" class="ui-input" placeholder="Site ID" />
        </div>
        <div class="form-group domain-or-email-group" data-platform="aliyun_esa">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="aliyun_esa_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="aliyun_esa_email" class="ui-input email-field"
              placeholder="your-email@example.com" />

      </div>

      <div id="baidu_dns_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">百度云 DNS 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">Access Key ID <span class="text-error">*</span></label>
          <input type="text" id="baidu_dns_access_key_id" class="ui-input" placeholder="AKID..." />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret Access Key <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="baidu_dns_secret_access_key" class="ui-input" placeholder="Secret..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('baidu_dns_secret_access_key', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="form-group domain-or-email-group" data-platform="baidu_dns">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="baidu_dns_domain_name" class="ui-input domain-field" placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="baidu_dns_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <div id="huawei_dns_fields" class="platform-fields hidden space-y-4">
        <div class="divider text-xs opacity-40">华为云 DNS 配置</div>
        <div class="ui-form-control">
          <label class="ui-label-text">Access Key ID <span class="text-error">*</span></label>
          <input type="text" id="huawei_dns_access_key_id" class="ui-input" placeholder="AKID..." />
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Secret Access Key <span class="text-error">*</span></label>
          <div class="flex items-center gap-2">
            <input type="password" id="huawei_dns_secret_access_key" class="ui-input" placeholder="Secret..."
              autocomplete="new-password" />
            <button type="button" class="btn btn-square btn-ghost btn-sm"
              onclick="togglePasswordVisibility('huawei_dns_secret_access_key', this)">
              {{ template "icons" (dict "Name" "ip-eyes") }}
            </button>
          </div>
        </div>
        <div class="ui-form-control">
          <label class="ui-label-text">Zone ID <span class="text-error">*</span></label>
          <input type="text" id="huawei_dns_zone_id" class="ui-input" placeholder="zone-..." />
        </div>
        <div class="form-group domain-or-email-group" data-platform="huawei_dns">
          <div class="ui-form-control" data-type="domain">
            <label class="ui-label-text">Domain Name <span class="text-error">*</span></label>
            <input type="text" id="huawei_dns_domain_name" class="ui-input domain-field"
              placeholder="your-domain.com" />
          </div>
          <div class="ui-form-control hidden" data-type="email">
            <label class="ui-label-text">Email <span class="text-error">*</span></label>
            <input type="email" id="huawei_dns_email" class="ui-input email-field"
              placeholder="your-email@example.com" />
          </div>
        </div>
      </div>

      <input type="hidden" name="id" id="id" />
      <input type="hidden" name="config" id="config_json" />

      <div class="modal-action gap-3">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('formModal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn-ui-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function togglePasswordVisibility(inputId, buttonElement) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === "password") {
      input.type = "text";
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-close") }}`;
    } else {
      input.type = "password";
      buttonElement.innerHTML = `{{ template "icons" (dict "Name" "ip-eyes") }}`;
    }
  }
</script>
{{ end }}
