{{ define "pages/cdn_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加 CDN 记录</h3>
    <form id="form">
      <div class="form-group">
        <label>选择配置 <span style="color: red">*</span></label>
        <select
          name="config_id"
          id="config_id"
          required
          onchange="onConfigSelect(this)"
        ></select>
      </div>

      <div class="form-group">
        <label>子域名部分 <span style="color: red">*</span></label>
        <div class="domain-input-group">
          <input
            type="text"
            name="sub_domain"
            id="sub_domain"
            required
            placeholder="例如 www, blog, api"
          />
          <span id="domain_name" class="domain-suffix-text"
            ></span
          >
        </div>
      </div>

      <div class="form-group">
        <label>记录类型 <span style="color: red">*</span></label>
        <select name="type" id="type" required onchange="onTypeSelect(this)">
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
        </select>
      </div>

      <div class="form-group">
        <label>回源协议 <span style="color: red">*</span></label>
        <select
          name="origin_protocol"
          id="origin_protocol"
          required
          onchange="onOriginProtocolSelect(this)"
        >
          <option value="follow">协议跟随</option>
          <option value="http">HTTP协议回源</option>
          <option value="https">HTTPS协议回源</option>
        </select>
      </div>

      <div class="form-group">
        <label>HTTP 端口 <span style="color: red">*</span></label>
        <input
          type="number"
          name="http_port"
          id="http_port"
          required
          placeholder="如 80"
        />
      </div>

      <div class="form-group">
        <label>HTTPS 端口 <span style="color: red">*</span></label>
        <input
          type="number"
          name="https_port"
          id="https_port"
          required
          placeholder="如 443"
        />
      </div>

      <div class="form-group">
        <label>IP 组 <span style="color: red">*</span></label>
        <select
          name="ip_group_id"
          id="ip_group_id"
          required
          onchange="onIpGroupSelect(this)"
        ></select>
      </div>

      <div class="form-group">
        <label>通知 (多选)</label>
        <select name="webhook_ids" id="webhook_ids" multiple></select>
        <small class="text-secondary"
          >选择需要接收此记录变动通知的 Webhook</small
        >
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          {{ template "icons" (dict "Name" "ip-close") }} 取消
        </button>
        <button type="submit" class="btn btn-primary">
          {{ template "icons" (dict "Name" "ip-save") }} 保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
