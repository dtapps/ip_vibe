{{ define "pages/cdn_form.html" }}
<div class="modal" id="cdnRecordModal">
  <div class="modal-content">
    <h3 id="cdnRecordModalTitle">添加 CDN 记录</h3>
    <form id="cdnRecordForm">
      <div class="form-group">
        <label>选择配置 <span style="color: red">*</span></label>
        <select
          name="config_id"
          id="cdn_record_config_id"
          required
          onchange="onCdnRecordConfigSelect(this)"
        ></select>
      </div>

      <div class="form-group">
        <label>域名 <span style="color: red">*</span></label>
        <input
          type="text"
          name="domain"
          id="cdn_record_domain"
          required
          placeholder="如 www.example.com"
        />
      </div>

      <div class="form-group">
        <label>记录类型 <span style="color: red">*</span></label>
        <select
          name="type"
          id="cdn_record_type"
          required
          onchange="onCdnRecordTypeSelect(this)"
        >
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
        </select>
      </div>

      <div class="form-group">
        <label>回源协议 <span style="color: red">*</span></label>
        <select
          name="origin_protocol"
          id="cdn_record_origin_protocol"
          required
          onchange="onCdnRecordOriginProtocolSelect(this)"
        >
          <option value="follow">协议跟随</option>
          <option value="http">HTTP协议回源</option>
          <option value="https">HTTPS协议回源</option>
        </select>
      </div>

      <div class="form-group">
        <label>HTTP 端口 <span style="color: red">*</span></label>
        <input
          type="number"
          name="http_port"
          id="cdn_record_http_port"
          required
          placeholder="如 80"
        />
      </div>

      <div class="form-group">
        <label>HTTPS 端口 <span style="color: red">*</span></label>
        <input
          type="number"
          name="https_port"
          id="cdn_record_https_port"
          required
          placeholder="如 443"
        />
      </div>

      <div class="form-group">
        <label>IP 组 <span style="color: red">*</span></label>
        <select
          name="ip_group_id"
          id="cdn_record_ip_group_id"
          required
          onchange="onCdnRecordIpGroupSelect(this)"
        ></select>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="cdn_record_id" />

      <div class="form-group mt-3" style="text-align: right">
        <button
          type="button"
          class="btn"
          onclick="closeModal('cdnRecordModal')"
        >
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-close" />
          </svg>
          取消
        </button>
        <button type="submit" class="btn btn-primary">
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-save" />
          </svg>
          保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
