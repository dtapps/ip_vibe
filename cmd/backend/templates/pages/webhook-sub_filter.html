{{ define "pages/webhook-sub_filter.html" }}

{{/* 初始化局部变量 */}}
{{ $action := .Action }}
{{ $filter := .Filter }}

<div class="ui-filter-container">
    <form method="GET" action="{{ $action }}" class="flex items-center gap-6 flex-1">

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">序号</span>
            <input type="number" name="id" value="{{ if $filter.ID }}{{ $filter.ID }}{{ end }}" placeholder="ID"
                class="ui-filter-input-compact w-20 font-mono text-center">
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">名称</span>
            <input type="text" name="name" value="{{ if $filter.Name }}{{ $filter.Name }}{{ end }}" placeholder="名称"
                class="ui-filter-input-compact w-20 font-mono text-center">
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">通知序号</span>
            <input type="number" name="webhook_id" value="{{ if $filter.WebhookID }}{{ $filter.WebhookID }}{{ end }}"
                placeholder="通知序号" class="ui-filter-input-compact w-20 font-mono text-center">
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">对象类型</span>
            <select name="obj_type" class="ui-filter-select w-36">
                <option value="">所有类型</option>
                {{ range $opt := (fieldEnumMap "webhook_subscription_obj_type") }}
                {{ if eq $opt.Value $filter.ObjType }}
                <option value="{{ $opt.Value }}" selected>{{ $opt.Label }}</option>
                {{ else }}
                <option value="{{ $opt.Value }}">{{ $opt.Label }}</option>
                {{ end }}
                {{ end }}
            </select>
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">对象序号</span>
            <input type="number" name="obj_id" value="{{ if $filter.ObjID }}{{ $filter.ObjID }}{{ end }}"
                placeholder="对象序号" class="ui-filter-input-compact w-20 font-mono text-center">
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">状态</span>
            <select name="is_active" class="ui-filter-select w-36">
                <option value="">所有状态</option>
                <option value="true" {{ if eq $filter.IsActive.IsTrue true }}selected{{ end }}>是</option>
                <option value="false" {{ if eq $filter.IsActive.IsFalse true }}selected{{ end }}>否</option>
            </select>
        </div>

        <div class="flex items-center gap-2 ml-auto">
            <button type="submit"
                class="btn btn-sm bg-primary hover:bg-primary-focus text-primary-content border-none rounded-xl px-5 h-8 min-h-0 font-black text-[11px] tracking-widest uppercase">
                筛选
            </button>
            <a href="{{ $action }}"
                class="btn btn-sm btn-ghost h-8 w-8 min-h-0 p-0 rounded-xl opacity-40 hover:opacity-100 transition-all">
                {{ template "icons" (dict "Name" "i-lucide-rotate-ccw" "Class" "w-4 h-4") }}
            </a>
        </div>
    </form>
</div>
{{ end }}
