{{ define "content" }}
<h1>🌐 DDNS管理平台</h1>

<div class="card" id="sectionTask">
  <div class="card-header">
    <h2 class="h2-icon">
      <svg class="ip-i">
        <use href="/static/icons.svg#ip-task"></use>
      </svg>
      任务管理
    </h2>
    <div>
      {{if eq .Status "running"}}
      <button class="btn btn-warning" disabled>
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-play"></use>
        </svg>
        启动
      </button>
      <button class="btn btn-danger" onclick="stopTask()">
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-stop"></use>
        </svg>
        停止
      </button>
      <button class="btn btn-warning" disabled>
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-close"></use>
        </svg>
        清理
      </button>
      {{else}}
      <button class="btn btn-warning" onclick="startTask()">
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-play"></use>
        </svg>
        启动
      </button>
      <button class="btn btn-danger" disabled>
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-stop"></use>
        </svg>
        停止
      </button>
      <button class="btn btn-warning" onclick="cleanTask()">
        <svg class="ip-i">
          <use href="/static/icons.svg#ip-close"></use>
        </svg>
        清理
      </button>
      {{end}}
    </div>
  </div>
  <div class="card-body">
    <table>
      <thead>
        <tr>
          <th>编号</th>
          <th>名称</th>
          <th>调度表达式</th>
          <th>执行时间</th>
          <th style="width: 300px; text-align: center">操作</th>
        </tr>
      </thead>
      <tbody id="groupTable">
        {{range .List}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Name}}</td>
          <td>{{.ScheduleDetail}}</td>
          <td>{{.LastRun}}</td>
          <td>
            <button
              class="btn btn-sm btn-outline-info"
              onclick="viewLiveExecutionTime('{{.ID}}','{{.Name}}')"
            >
              <svg class="ip-i">
                <use href="/static/icons.svg#ip-eyes"></use>
              </svg>
              下次执行时间
            </button>
            <button class="btn btn-success btn-sm" onclick="runTask('{{.ID}}')">
              <svg class="ip-i">
                <use href="/static/icons.svg#ip-running"></use>
              </svg>
              运行
            </button>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>

    <!-- 实时 执行时间 弹窗 -->
    <div class="modal" id="liveExecutionTimeModal">
      <div class="modal-content ip-popup">
        <!-- 头部 -->
        <div class="ip-popup-header">
          <h4 class="ip-popup-title" id="liveExecutionTimeTitle">
            <svg class="ip-i">
              <use href="/static/icons.svg#ip-eyes" />
              </use>
            </svg>
            实时 执行时间
          </h4>
          <button class="ip-popup-close" onclick="closeModal('liveExecutionTimeModal')" aria-label="关闭">
            <svg class="ip-i">
              <use href="/static/icons.svg#ip-close" />
              </use>
            </svg>
          </button>
        </div>

        <!-- 工具栏 -->
        <div class="ip-popup-toolbar">
          <span class="ip-popup-count">共 <b id="liveExecutionTimeCount">0</b> 条</span>
          <button class="ip-popup-copy" onclick="copyData('liveExecutionTimePre')">
            <svg class="ip-i">
              <use href="/static/icons.svg#ip-copy" />
              </use>
            </svg>
            一键复制
          </button>
        </div>

        <!-- 代码块区域 -->
        <pre class="ip-popup-pre" id="liveExecutionTimePre">点击“实时IP”按钮后，内容将显示在这里</pre>

        <!-- 底部按钮 -->
        <div class="ip-popup-footer">
          <button class="btn" onclick="closeModal('liveExecutionTimeModal')">
            <svg class="ip-i">
              <use href="/static/icons.svg#ip-close" />
              </use>
            </svg> 关闭</button>
        </div>
      </div>
    </div>

    <script src="/static/js/task.js"></script>
{{ end }}
