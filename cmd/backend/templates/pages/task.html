{{ define "content" }}
<h1>🌐 DDNS管理平台</h1>

<div class="card">
  <div class="card-header">
    <h2 class="h2-icon">
      {{ template "icons" (dict "Name" "ip-task") }} 任务管理
    </h2>
    <div>
      {{if eq .Status "running"}}
      <button class="btn btn-warning" disabled>
        {{ template "icons" (dict "Name" "ip-play") }} 启动
      </button>
      <button class="btn btn-danger" onclick="stopTaskScheduler()">
        {{ template "icons" (dict "Name" "ip-stop") }} 停止
      </button>
      <button class="btn btn-warning" disabled>
        {{ template "icons" (dict "Name" "ip-close") }} 清理
      </button>
      {{else}}
      <button class="btn btn-warning" onclick="startTaskScheduler()">
        {{ template "icons" (dict "Name" "ip-play") }} 启动
      </button>
      <button class="btn btn-danger" disabled>
        {{ template "icons" (dict "Name" "ip-stop") }} 停止
      </button>
      <button class="btn btn-warning" onclick="cleanTask()">
        {{ template "icons" (dict "Name" "ip-close") }} 清理
      </button>
      {{end}}
    </div>
  </div>
  <div class="card-body">
    <table>
      <thead>
        <tr>
          <th>编号</th>
          <th>名称</th>
          <th>调度表达式</th>
          <th>执行时间</th>
          <th style="width: 300px; text-align: center">操作</th>
        </tr>
      </thead>
      <tbody id="table">
        {{range .List}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Name}}</td>
          <td>{{.ScheduleDetail}}</td>
          <td>{{.LastRun}}</td>
          <td>
            <button
              class="btn btn-sm btn-outline-info"
              onclick="onNextRunPopup('{{.ID}}','{{.Name}}')"
            >
              {{ template "icons" (dict "Name" "ip-eyes") }} 下次执行时间
            </button>
            <button class="btn btn-success btn-sm" onclick="runTask('{{.ID}}')">
              {{ template "icons" (dict "Name" "ip-running") }} 运行
            </button>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
    <!-- 分页 -->
    {{ template "pagination" . }}
  </div>
</div>

<!-- 弹窗 -->
{{ template "popup" . }}

<script src="/static/js/task.js"></script>
{{ end }}
