{{ define "content" }}
<h1>平台配置</h1>

<div class="card" id="sectionDevices">
    <div class="card-header">
        <h2 class="h2-icon">
            <svg class="ip-i">
                <use href="/static/icons.svg#ip-devices"></use>
            </svg>
            设备实时上报
        </h2>
        <div>
            <button class="btn btn-primary" onclick="openDeviceModal()">
                <svg class="ip-i">
                    <use href="/static/icons.svg#ip-mobile"></use>
                </svg> 管理设备
            </button>
        </div>
    </div>
    <div class="card-body">
        <table>
            <thead>
                <tr>
              <th>编号</th>
              <th>名称</th>
              <th>最新 IPv4</th>
              <th>最新 IPv6</th>
              <th>上报时间</th>
              <th style="width: 300px;text-align: center;">操作</th>
                </tr>
            </thead>
            <tbody id="deviceTable">
                {{ range .List }}
               <tr class="device-row" data-last-heartbeat="{{.LastHeartbeatAt.Unix}}">
              <td>{{.Code}}</td>
              <td>{{.Name}}</td>
              <td class="text-monospace">{{.IPV4}}</td>
              <td class="text-monospace">{{.IPV6}}</td>
              <td>{{formatTimeOrNil .LastReportedAt}}</td>
              <td>
                <button class="btn btn-sm btn-outline-info" onclick="viewLiveDeviceIpHistory('{{.ID}}','{{.Name}}')">
                  <svg class="ip-i">
                    <use href="/static/icons.svg#ip-eyes"></use>
                  </svg> 历史IP
                </button>
                <button class="btn btn-primary btn-sm" onclick="openDeviceModal('{{.ID}}')">
                  <svg class="ip-i">
                    <use href="/static/icons.svg#ip-edit"></use>
                  </svg> 编辑
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteDevice('{{.ID}}')">
                  <svg class="ip-i">
                    <use href="/static/icons.svg#ip-delete"></use>
                  </svg> 删除
                </button>
              </td>
            </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
