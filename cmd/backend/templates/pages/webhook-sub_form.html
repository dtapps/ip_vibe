{{ define "pages/webhook-sub_form.html" }}
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加 / 编辑 通知订阅</h3>
    <form id="form">
      <div class="form-group">
        <label>名称 <span style="color: red">*</span></label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="如：告警-IP"
        />
      </div>

      <div class="form-group">
        <label>通知 <span style="color: red">*</span></label>
        <select
          name="webhook_id"
          id="webhook_id"
          required
          onchange="onWebhookIdSelect(this)"
        ></select>
      </div>

      <div class="form-group">
        <label>订阅对象 <span style="color: red">*</span></label>
        <select
          name="obj_id"
          id="obj_id"
          required
          multiple
          onchange="onObjIdSelect(this)"
          class="multiselect-device"
        ></select>
      </div>

      <!-- 隐藏字段 -->
      <input type="hidden" name="id" id="id" />
      <input type="hidden" name="obj_type" id="obj_type" />

      <div class="form-group mt-3" style="text-align: right">
        <button type="button" class="btn" onclick="closeModal('modal')">
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-close" />
          </svg>
          取消
        </button>
        <button type="submit" class="btn btn-primary">
          <svg class="ip-i">
            <use href="/static/img/icons.svg#ip-save" />
          </svg>
          保存
        </button>
      </div>
    </form>
  </div>
</div>
{{ end }}
