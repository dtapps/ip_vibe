{{ define "pages/log-content_filter.html" }}

{{/* 初始化局部变量 */}}
{{ $action := .Action }}
{{ $filter := .Filter }}

<div class="ui-filter-container">
    <form method="GET" action="{{ $action }}" class="flex items-center gap-6 flex-1">

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">主机名</span>
            <input type="text" name="hostname" value="{{ if $filter.Hostname }}{{ $filter.Hostname }}{{ end }}"
                placeholder="主机名" class="ui-filter-input-compact w-40 font-mono text-center">
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">方法</span>
            <select name="method" class="ui-filter-select w-30">
                <option value="">所有方法</option>
                <option value="GET">GET</option>
                <option value="HEAD">HEAD</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
                <option value="CONNECT">CONNECT</option>
                <option value="OPTIONS">OPTIONS</option>
                <option value="TRACE">TRACE</option>
            </select>
        </div>

        <div class="flex items-center gap-3">
            <span class="ui-filter-label">状态码</span>
            <input type="number" name="status_code" value="{{ if $filter.StatusCode }}{{ $filter.StatusCode }}{{ end }}"
                placeholder="状态码" class="ui-filter-input-compact w-20 font-mono text-center">
        </div>

        <div class="flex items-center gap-2 ml-auto">
            <button type="submit"
                class="btn btn-sm bg-primary hover:bg-primary-focus text-primary-content border-none rounded-xl px-5 h-8 min-h-0 font-black text-[11px] tracking-widest uppercase">
                筛选
            </button>
            <a href="{{ $action }}"
                class="btn btn-sm btn-ghost h-8 w-8 min-h-0 p-0 rounded-xl opacity-40 hover:opacity-100 transition-all">
                {{ template "icons" (dict "Name" "i-lucide-rotate-ccw" "Class" "w-4 h-4") }}
            </a>
        </div>
    </form>
</div>
{{ end }}
