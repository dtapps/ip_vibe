{{ define "pages/ssl_view.html" }}
<div id="viewModal" class="modal">
    <div class="ui-modal-box !max-w-5xl">
        <div class="ui-header">
            <h3 class="text-xl font-bold flex items-center gap-2">
                {{ template "icons" (dict "Name" "i-lucide-shield-check") }} <span id="modalTitle">证书内容详情</span>
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('viewModal')">
                {{ template "icons" (dict "Name" "i-lucide-x") }}
            </button>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold opacity-70">证书文件 (CRT / PEM)</label>
                    <button class="btn btn-xs btn-ghost text-primary copy-btn"
                        data-clipboard-target="#sslCrt">复制</button>
                </div>
                <textarea id="sslCrt" readonly
                    class="w-full h-80 p-4 bg-base-300/30 rounded-2xl font-mono text-xs leading-relaxed border border-base-300/20 focus:outline-none resize-none text-base-content"></textarea>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold opacity-70">私钥文件 (KEY)</label>
                    <button class="btn btn-xs btn-ghost text-primary copy-btn"
                        data-clipboard-target="#sslKey">复制</button>
                </div>
                <textarea id="sslKey" readonly
                    class="w-full h-80 p-4 bg-base-300/30 rounded-2xl font-mono text-xs leading-relaxed border border-base-300/20 focus:outline-none resize-none text-base-content"></textarea>
            </div>
        </div>

        <div class="modal-action p-8 pt-0">
            <button class="btn btn-sm btn-ghost rounded-xl" onclick="closeModal('viewModal')">关闭</button>
        </div>
    </div>
</div>

<script>
    // 使用监听器确保 ClipboardJS 已经加载
    (function initClipboard() {
        if (typeof ClipboardJS === 'undefined') {
            // 如果还没加载完，等 200ms 再试
            setTimeout(initClipboard, 200);
            return;
        }

        const clipboard = new ClipboardJS('.copy-btn',);

        clipboard.on('success', function (e) {
            const btn = e.trigger;
            const oldText = btn.innerText;
            const icon = btn.querySelector('span');

            btn.innerText = "";
            btn.appendChild(document.createTextNode(' ✅ 已复制'));
            btn.classList.add("text-success");

            setTimeout(() => {
                btn.innerText = "";
                if (icon) {
                    btn.appendChild(icon)
                };
                btn.appendChild(document.createTextNode(oldText));
                btn.classList.remove("text-success");
            }, 1500);
            e.clearSelection();
        });

        clipboard.on('error', function (e) {
            console.error('ssl_view clipboard error', e);
            alert('复制失败，请手动选择复制');
        });
    })();
</script>
{{ end }}
