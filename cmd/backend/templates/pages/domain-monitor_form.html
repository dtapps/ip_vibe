{{ define "pages/domain-monitor_form.html" }}
<div id="formModal" class="modal">
  <div class="ui-modal-box">
    <div class="ui-header">
      <h3 class="text-xl font-bold">
        {{ template "icons" (dict "Name" "i-lucide-search-code") }} <span id="modalTitle">添加 / 编辑 域名监控</span>
      </h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="closeModal('formModal')">
        {{ template "icons" (dict "Name" "i-lucide-x") }}
      </button>
    </div>

    <form id="form" class="ui-form-container">

      <div class="ui-form-control">
        <label class="ui-label-text">名称 <span class="text-error">*</span></label>
        <input type="text" name="name" id="name" class="ui-input" required placeholder="如 example" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">描述</label>
        <textarea name="description" id="description" class="ui-textarea" placeholder="可选"></textarea>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">域名 <span class="text-error">*</span></label>
        <input type="text" name="domain" id="domain" class="ui-input" required placeholder="如 www.example.com" />
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">请求头（多个之间用换行符分隔，格式：key=value）</label>
        <textarea name="request_headers" id="request_headers" class="ui-textarea" placeholder="可选"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="ui-form-control">
          <label class="ui-label-text">检查间隔（秒） <span class="text-error">*</span></label>
          <input type="number" name="check_interval" id="check_interval" class="ui-input" value="60" required
            placeholder="如 60" />
        </div>

        <div class="ui-form-control">
          <label class="ui-label-text">检查类型 <span class="text-error">*</span></label>
          <select name="check_protocol" id="check_protocol" class="ui-select" required
            onchange="onCheckProtocolSelect(this)">
            <option value="" disabled selected>请选择检查类型</option>
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
          </select>
        </div>
      </div>

      <div class="ui-form-control">
        <label class="ui-label-text">通知 (多选)</label>
        <select name="webhook_ids" id="webhook_ids" class="ui-select" multiple></select>
        <div class="ui-hint">选择需要接收此记录变动通知的 Webhook</div>
      </div>

      <input type="hidden" name="id" id="id" />

      <div class="modal-action gap-3">
        <button type="button" class="btn btn-sm btn-ghost" onclick="closeModal('formModal')">
          {{ template "icons" (dict "Name" "i-lucide-x") }} 取消
        </button>
        <button type="submit" class="btn-ui-primary">
          {{ template "icons" (dict "Name" "i-lucide-save") }} 保存
        </button>
      </div>

    </form>
  </div>
</div>
{{ end }}
