branch:
  - buttons:
      - name: 打包 Go 项目
        description: 打包 Go 项目 然后上传到附件（版本号带 rc/beta/alpha/nightly 时自动标记为预发布）
        event: web_trigger_release # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: 打包版本
            description: 请输入打包版本，如 v1.2.3；预发布版本请带 rc/beta/alpha/nightly 后缀，如 v1.2.3-rc.1、v1.2.3-nightly.20260101（填 nightly
              自动推导当天夜间构建版本）
            required: true # 是否必填
            type: input
            default: nightly
          commit:
            name: 构建提交
            description: 可选：要发布的代码版本（完整 SHA / 分支 / tag）；留空则用当前分支 HEAD
            required: false
            type: input

      - name: 打包 Docker 镜像
        description: 打包 Docker 镜像 然后上传到 制品库（预发布版本不会覆盖 latest 标签）
        event: web_trigger_build_docker_image # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: 打包版本
            description: 请输入打包版本，如 v1.2.3；预发布版本请带 rc/beta/alpha/nightly 后缀，如 v1.2.3-rc.1、v1.2.3-nightly.20260101（填 nightly
              自动推导当天夜间构建版本）
            required: true # 是否必填
            type: input
            default: nightly
          commit:
            name: 构建提交
            description: 可选：要发布的代码版本（完整 SHA / 分支 / tag）；留空则用当前分支 HEAD
            required: false
            type: input

      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
