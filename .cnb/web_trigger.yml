branch:
  - buttons:
      - name: 打包 Go 项目
        description: 打包 Go 项目 然后上传到附件
        event: web_trigger_build_go_project # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            # 输入框
            description: 请输入打包版本
            required: true # 是否必填
            type: input
            default:

      - name: 打包 Docker 镜像
        description: 打包 Docker 镜像 然后上传到 制品库
        event: web_trigger_build_docker_image # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            # 输入框
            description: 请输入打包版本
            required: false # 是否必填
            type: input
            default:
