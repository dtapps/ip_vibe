"**":
  push:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        cpus: 64 # 如有需要，可根据实际情况调整
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /go:copy-on-write # 缓存整个 GOPATH（包含 mod、bin 等）
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /go/pkg/mod:copy-on-write # Go 模块缓存 - 加速依赖下载
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      env:
        LINT_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
      stages:
        - name: 验证 make 工具
          script: make --version

        - name: 更新 Go 依赖
          script: make deps

        - name: 更新 pnpm 依赖
          script: make update-pnpm

        - name: 检查项目
          script: make check-all
