# Issue 模板选择页配置
#
# 关闭空白 Issue，引导用户使用「提交缺陷」「提交建议」或「发版公告」模板，
# 保证反馈包含复现信息或建议场景，公告包含版本号、变更摘要与下载地址。
#
# 文档、发布记录与流水线说明通过 contact_links 放在模板选择页上。
blank_issues_enabled: false

contact_links:
  - name: 使用帮助与文档
    url: https://cnb.cool/dtapp/ip_vibe/-/blob/master/README.md
    about: 功能说明、环境变量、常用命令与 docs/ 下的专题文档索引

  - name: 历史发布记录
    url: https://cnb.cool/dtapp/ip_vibe/-/releases
    about: 查看已发布版本的 Release 正文、下载附件与 SHA256SUMS

  - name: 构建与发布流程
    url: https://cnb.cool/dtapp/ip_vibe/-/blob/master/docs/ci-cd.md
    about: 版本号规则、多平台矩阵、发布平台与镜像同步的说明
