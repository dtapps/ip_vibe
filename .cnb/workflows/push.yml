'**':
  push:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        cpus: 64 # 如有需要，可根据实际情况调整
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      env:
        LINT_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
      stages:
        - name: 安装依赖
          script: make deps

        - name: 检查项目
          script: make check-all

    # 流水线 2：知识库构建。与上方流水线 1 相互独立、并行执行——
    # push 事件的值是 Pipeline 数组，CNB 对同一事件触发的多条 Pipeline 并行运行。
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          settings:
            include: 'docs/**.md'

    # 流水线 3：Go 单元测试覆盖率（全量红线）。与流水线 1/2 并行执行。
    # 复用同一 Dockerfile 构建环境与 Go 模块/构建缓存（不需要 pnpm 缓存，不构建前端）。
    # 参考 CNB 官方示例 examples/ecosystem/testing-go-demo 的 testing:coverage 内置任务。
    - runner:
        tags: cnb:arch:amd64
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      stages:
        - name: 生成测试覆盖率
          script:
            - go mod download
            # 内联：覆盖 cmd/internal/pkg 业务代码；排除 4 处 ent 生成目录（ent 占全树语句约 73%，计入会把约 27% 稀释到约 5%）与 tests/ 集成测试，产出 coverage.out
            - go test -vet=off -coverpkg=$(go list ./cmd/... ./internal/... ./pkg/... | grep -vE '/(ent|ent_log|ent_stat)(/|$)'
              | paste -sd, -) -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...
            - go tool cover -func=coverage.out

        - name: 上报覆盖率（全量红线）
          # https://docs.cnb.cool/zh/build/internal-steps/testing/coverage.html
          type: testing:coverage
          options:
            lines: 20 # 全量覆盖率红线（%），低于此值阻断流水线；当前基线约 27%，留余量后逐步上调
            lang: go # golang 格式的覆盖率报告必须指定，否则计算有误差
            pattern: 'coverage.out'
            breakIfNoCoverage: true # 找不到覆盖率报告则报错终止，避免静默通过
            key: go # 多报告数据键：与 Node 侧（key: node）区分，各自写入 meta map 互不覆盖
            name: Go Coverage # 徽章显示名，与 key 一对一对应
          exports:
            lines: COVERAGE_LINES
            diff_pct: COVERAGE_DIFF_PCT

        - name: 输出覆盖率
          script: 'echo "coverage: lines=$COVERAGE_LINES diff=$COVERAGE_DIFF_PCT"'

    # 流水线 4：前端（Node/vanilla JS）单元测试覆盖率（全量红线）。与 1/2/3 并行执行。
    # 技术栈为原生 JS（jQuery/daisyUI/Tailwind），非 Vite/Vue/TS；用 Node 内置 test runner + c8
    # 覆盖 CJS（vitest 对 CJS 经 vite-node 转译会丢失插桩，c8 通过 require hook 原生支持 CJS）。
    - runner:
        tags: cnb:arch:amd64
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile（已预装 Node + pnpm）
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      stages:
        - name: 安装前端依赖
          script: pnpm --dir ./cmd/frontend install --frozen-lockfile

        - name: 生成前端测试覆盖率
          script: pnpm --dir ./cmd/frontend test:coverage # 产出 cmd/frontend/coverage/lcov.info

        - name: 上报覆盖率（全量红线）
          # https://docs.cnb.cool/zh/build/internal-steps/testing/coverage.html
          type: testing:coverage
          options:
            lines: 1 # 全量行覆盖红线（%）：当前基线≈1%（仅 uuid 已测），随测试增多逐步上调
            pattern: 'cmd/frontend/coverage/lcov.info'
            breakIfNoCoverage: true # 找不到覆盖率报告则报错终止，避免静默通过
            key: node # 多报告数据键：与 Go 侧（key: go）区分，各自写入 meta map 互不覆盖
            name: Node Coverage # 徽章显示名，与 key 一对一对应
          exports:
            lines: NODE_COVERAGE_LINES

        - name: 输出覆盖率
          script: 'echo "node coverage: lines=$NODE_COVERAGE_LINES"'

