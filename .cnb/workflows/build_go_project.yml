"**":
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_build_go_project:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        cpus: 64 # 如有需要，可根据实际情况调整
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /go:copy-on-write # 缓存整个 GOPATH（包含 mod、bin 等）
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /go/pkg/mod:copy-on-write # Go 模块缓存 - 加速依赖下载
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      stages:
        - name: 验证 make 工具
          script: make --version
        
        - name: 验证 go 工具
          script: go version

        - name: 验证 node 工具
          script: node --version

        - name: 验证 npm 工具
          script: npm --version

        - name: 验证 pnpm 工具
          script: pnpm --version

        - name: 验证 upx 工具
          script: upx --version

        - name: 验证 golangci-lint 工具
          script: golangci-lint --version

        - name: 验证 nfpm 工具
          script: nfpm --version

        - name: 验证 wixl 工具
          script: wixl --version

        - name: 输出基本信息
          script: |
            echo "原始 version: $version"

            # 1. 如果输入没有 v 前缀，自动加上
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi

            echo "处理 version: $version"

            # 2 .通过 set-output 输出到 result
            echo "##[set-output interior_version=$version]"
          exports:
            interior_version: INTERIOR_VERSION

        - name: 安装依赖
          script: make deps

        - name: 构建前端静态文件
          script: VERSION=${INTERIOR_VERSION} make build-frontend

        - name: 构建所有平台二进制文件
          script: VERSION=${INTERIOR_VERSION} make build-all

        - name: 清理二进制文件
          script: make clean-binaries

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/changelog.html
        - name: 生成 Release 日志
          image: cnbcool/changelog
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            description: ${LATEST_CHANGE_LOG}

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - "bin/*"
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
