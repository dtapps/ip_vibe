# 发布工作流（CNB）
#
# 两种触发共用同一份作业：顶层 .trigger_release 定义锚点，两个事件各引用一次。
#   - web_trigger_release：master 分支按钮「打包 Go 项目」手动触发，
#     全平台压缩包 + Release + 附件（从源码构建）。
#   - api_trigger_release：GitHub Actions 发布 Release 后由 Open API 触发
#     （POST https://api.cnb.cool/dtapp/ip_vibe/-/build/start，event=api_trigger_release，
#     env 传 version / commit），用同一个提交再发一份到 CNB。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 GitHub 的
# .github/workflows/release.yml 同口径）：
#   v1.2.3                  -> 正式版，Release 不勾选 prerelease
#   v1.2.3-rc.1             -> 预发布（rc 渠道），Release 勾选 prerelease
#   v1.2.3-beta.1           -> 预发布（beta 渠道），Release 勾选 prerelease
#   v1.2.3-alpha.1          -> 预发布（alpha 渠道），Release 勾选 prerelease
#   v1.2.3-nightly.20260101 -> 预发布（nightly 渠道），Release 勾选 prerelease
#   nightly                 -> 自动展开成 v<最近正式版 +1 补丁>-nightly.<UTC 日期>
#                              （GitHub 侧展开好再传进来，这里传什么就发什么）
#
# Release 标题：IPVibe <版本号>，预发布再加 "(预发布)" 后缀；tag 始终是纯版本号。

# 顶层伪键：仅用于定义作业锚点，不会被当成分支事件执行。
.trigger_release: &trigger_release
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  services:
    - docker # 启用 Docker 服务（用于 docker build/push）
  docker:
    image: docker.cnb.cool/dtapp/golang:latest # 统一使用 CNB 内部 CI 基础镜像
    volumes:
      - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
      - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
  stages:
    - name: 输出基本信息
      script: |
        echo "原始 version: $version"
        echo "原始 commit: ${commit:-<空，使用当前检出>}"

        # 指定 commit 时切换工作区（CNB 默认检出触发时的 commit）。
        # 先补拉历史，避免浅克隆里没有目标对象。
        if [ -n "${commit:-}" ]; then
          git fetch --quiet --force --unshallow origin 2>/dev/null || git fetch --quiet --force origin || true
          # 该 commit 可能只推到了 GitHub 镜像（CNB 与 GitHub 是两个仓库），按 SHA 再拉一次；
          # 仍然拿不到就明确失败 —— 悄悄退回 HEAD 会构建出「与发布版本不同的代码」，
          # 那比直接失败更难发现。
          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            git fetch --quiet --force origin "${commit}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            echo "❌ commit ${commit} 在本仓库不存在"
            echo "   （CNB 与 GitHub 是两个仓库，该 commit 可能只推到了 GitHub 镜像）"
            echo "   先把它推到 CNB 仓库，或不要传 commit（用当前检出的 HEAD）"
            exit 1
          fi
          git checkout --detach "${commit}"
        fi
        commit_full="$(git rev-parse HEAD)"
        commit_short="$(git rev-parse --short HEAD)"
        echo "构建 commit: ${commit_short} (${commit_full})"

        # 归一化（补 v 前缀）与预发布判定只有一份实现，CNB 与 GitHub 都 source 它，
        # 避免两边各写一套 grep 正则、判断口径慢慢跑偏。
        # 结果：TAG（带 v 前缀）/ PRERELEASE（true|false）/ VERSION_TYPE / PRE_NOTE
        # 版本号为空或含非法字符时 resolve_version 返回 1，这里直接让 stage 失败，
        # 而不是打出 :v 这种非法 tag，或把引号带进后面 optionsFrom 的 JSON。
        # `nightly` 会在这里展开成 v<最近正式版+1 补丁>-nightly.<UTC 日期>。
        . scripts/ci/resolve-prerelease.sh
        resolve_version "$version" || exit 1
        echo "$PRE_NOTE"

        # 通过 set-output 输出到 result，由下方 exports 映射成后续 stage 的环境变量。
        echo "##[set-output interior_version=$TAG]"
        echo "##[set-output interior_prerelease=$PRERELEASE]"
        echo "##[set-output interior_commit_full=$commit_full]"
        echo "##[set-output interior_commit_short=$commit_short]"
      exports:
        interior_version: INTERIOR_VERSION
        interior_prerelease: INTERIOR_PRERELEASE
        interior_commit_full: INTERIOR_COMMIT_FULL
        interior_commit_short: INTERIOR_COMMIT_SHORT

    - name: 安装所有依赖
      script: make deps

    - name: 构建前端静态文件
      script: VERSION=${INTERIOR_VERSION} make build-frontend

    - name: 构建所有平台二进制文件
      script: VERSION=${INTERIOR_VERSION} COMMIT=${INTERIOR_COMMIT_SHORT} make build-all

    - name: 清理二进制文件
      script: make clean-binaries

    - name: 生成校验文件
      script: |
        set -eu
        cd bin
        : > SHA256SUMS
        for f in *.tar.gz *.zip; do
          [ -e "${f}" ] || continue
          sha256sum "${f}" >> SHA256SUMS
        done
        cat SHA256SUMS

    # 发版前先把版本号这件事验干净。这三件事出错都不会让构建失败，
    # 但会发出一个「看起来成功、内容是错的」Release：
    #   1) tag 没拉全 → changelog 算不出基准，正文变成「首次发布」
    #   2) tag 已经存在 → 覆盖已有 tag，历史 Release 的对比基准跟着变
    #   3) 版本号比已有的还旧 → 正文里 diff 是反的
    - name: 校验版本号与 tag
      script: |
        set -eu
        echo "版本号: ${INTERIOR_VERSION}"

        # tag 拉全（CNB 的 checkout 不一定带 tag，缺了就没法算基准）
        git fetch --tags --quiet --force || true
        count=$(git tag -l 'v*' | wc -l | tr -d ' ')
        echo "本地版本 tag: ${count} 个"
        if [ "$count" -eq 0 ]; then
          echo "❌ 一个版本 tag 都没有，changelog 会退化成「首次发布」"
          echo "   检查 checkout 是否带 tag，或手动 git fetch --tags"
          exit 1
        fi

        case "${INTERIOR_VERSION}" in
          *-nightly.*)
            # 夜间构建按天发布同一个 tag（同一天重跑/补发要能覆盖）：
            # 允许 tag 已存在，后面「删除已存在的 Release 与 Tag」会先清掉再重建。
            echo "✅ ${INTERIOR_VERSION} 是夜间构建，允许覆盖同名 Release"
            ;;
          *)
            # tag 不能已经存在：重跑同一次发布会把 tag 挪到新提交上
            if git rev-parse -q --verify "refs/tags/${INTERIOR_VERSION}" >/dev/null; then
              echo "❌ tag ${INTERIOR_VERSION} 已存在，不能重复发布"
              echo "   已有指向: $(git rev-parse --short "${INTERIOR_VERSION}")"
              echo "   当前 HEAD: $(git rev-parse --short HEAD)"
              exit 1
            fi
            echo "✅ tag ${INTERIOR_VERSION} 不存在，可以发布"

            # 新版本必须比已有的正式版更新，否则正文里的 diff 是反的
            if [ "${INTERIOR_PRERELEASE}" = "false" ]; then
              latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
              if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${INTERIOR_VERSION}" | sort -V | tail -n 1)" != "${INTERIOR_VERSION}" ]; then
                echo "❌ 版本号 ${INTERIOR_VERSION} 比已有的正式版 ${latest} 旧"
                exit 1
              fi
              echo "✅ 比上一个正式版 ${latest:-（无）} 新"
            fi
            ;;
        esac

    # 正文与更新内容只有一份实现（scripts/ci/*.sh），GitHub 那份也调用同样的脚本，
    # 避免两边各写一遍表格/标题/下载链接，改一处忘一处。
    - name: 生成 Release 正文
      script: |
        set -eu
        # 打包没出产物就别往下走：否则会发出一个零附件的 Release，正文表格是空的，
        # 看起来「成功」，用户点开什么都下不到。
        count=$(find bin -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
        if [ "$count" -eq 0 ]; then
          echo "❌ 打包没有产出任何压缩包，先看 make build-all 的日志"
          exit 1
        fi
        echo "产物 ${count} 个"

        CNB_BASE="${CNB_REPO_URL_HTTPS%/}"
        # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、nightly 对 nightly、
        # 正式版对正式版；首次发某渠道则回退到上一个正式版）。实现见 scripts/ci/release-changelog.sh。
        # 脚本挑不出基准时会 exit 1（而不是谎报「首次发布」），这里显式接住，
        # 免得 CNB 不传播退出码、正文带着错误提示发出去。
        # CNB 的 Web 路径统一带 /-/ 前缀（releases 是 /-/releases，提交是 /-/commit），
        # 和 GitHub 的 /commit 不同，所以前缀由调用方传，脚本里不猜。
        if ! LATEST_CHANGE_LOG="$(REPO_URL="${CNB_BASE}" \
          COMMIT_URL="${CNB_BASE}/-/commit" \
          sh scripts/ci/release-changelog.sh "${INTERIOR_VERSION}")"; then
          echo "❌ 生成更新内容失败，见上面的错误信息"
          exit 1
        fi
        VERSION="${INTERIOR_VERSION}" \
          PRERELEASE="${INTERIOR_PRERELEASE}" \
          DL_BASE="${CNB_BASE}/-/releases/download/${INTERIOR_VERSION}" \
          STABLE_URL="${CNB_BASE}/-/releases" \
          REPO_URL="${CNB_BASE}" \
          COMMIT_URL="${CNB_BASE}/-/commit" \
          COMMIT_SHA="${INTERIOR_COMMIT_FULL}" \
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
          ARTIFACT_DIR=bin \
          ARTIFACT_LAYOUT=triplet \
          OUT_FILE=release_body.md \
          CHANGELOG="${LATEST_CHANGE_LOG}" \
          sh scripts/ci/render-release-body.sh

    # 删除已存在的 Release 与 Tag，再重建，避免旧附件堆积。
    # 只在 nightly 同日重跑时才会命中（正式版 / rc / beta / alpha 的 tag 已存在会被上一道校验挡住）。
    # 两步均调用 CNB Open API，CNB_TOKEN 需 repo-release:rw 权限，
    # CNB_API_ENDPOINT 由流水线自动注入。注意：DeleteTag 不会自动删 Release，
    # DeleteRelease 也不会自动删 Tag，所以两个对象必须分别删除。
    - name: 删除已存在的 Release 与 Tag
      script: |
        set -eu
        case "${INTERIOR_VERSION}" in
          *-nightly.*) ;;
          *) echo "非 nightly 发布（${INTERIOR_VERSION}），无需删除同名 Release / Tag" ; exit 0 ;;
        esac

        API="${CNB_API_ENDPOINT%/}"
        REPO="$CNB_REPO_SLUG"
        TAG="${INTERIOR_VERSION}"

        # ---- 第 1 步：删除 Release（发行版） ----
        # 查询：GET /-/releases/tags/{tag}  → 200 存在 / 404 不存在
        echo "查询是否已存在 release (tag=$TAG) ..."
        HTTP=$(curl -s -o /tmp/nr.json -w "%{http_code}" \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/releases/tags/$TAG")
        if [ "$HTTP" = "200" ]; then
          ID=$(jq -r '.id // .release_id // empty' /tmp/nr.json)
          echo "release 已存在 (id=$ID)，删除后重新发布"
          # 删除：DELETE /-/releases/{id}  → 成功返回 204/200
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/$ID")
          if [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; then
            echo "已删除旧 release"
          else
            echo "删除 release 失败 HTTP=$DEL"; exit 1
          fi
        elif [ "$HTTP" = "404" ]; then
          echo "release 不存在，直接发布"
        else
          echo "查询 release 失败 HTTP=$HTTP"; cat /tmp/nr.json; exit 1
        fi

        # ---- 第 2 步：删除 Git Tag（标签） ----
        # 删除：DELETE /-/tags/{repo}/{tag} → 204 成功 / 404 不存在
        # 该接口仅删 tag，不删关联 Release，故需在第 1 步之外单独删除。
        echo "删除同名 tag (tag=$TAG) ..."
        TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/tags/$TAG")
        if [ "$TAG_HTTP" = "204" ] || [ "$TAG_HTTP" = "200" ]; then
          echo "已删除旧 tag"
        elif [ "$TAG_HTTP" = "404" ]; then
          echo "tag 不存在，跳过"
        else
          # 删 tag 失败不阻断发布（后续 git:release 会在已有 tag 上重建）
          echo "删除 tag 失败 HTTP=$TAG_HTTP（继续发布）"
        fi

    # 生成 Release 选项文件，供 git:release 的 optionsFrom 读取。
    #
    # 为什么不用 options 里的 ${INTERIOR_PRERELEASE} 直接插值：preRelease 的类型是严格的
    # Boolean（对比 latest 明确允许 "true"|"false" 字符串），而变量替换产出的是字符串
    # "false"，字符串在布尔位置上容易被当成真值，导致正式版也被勾成预发布。
    # 走 optionsFrom 读到的是 JSON 里真正的布尔值，没有这个歧义。
    # descriptionFromFile 同理：正文里有反引号、管道符和换行，塞进插值里容易被转义毁掉。
    - name: 生成 Release 选项文件
      script: |
        set -eu
        # 空值写进配置后 git:release 会当成脏配置，报错还落在「发布」那一步，
        # 跟真正的原因隔了三屏。空就直接死在这一步。
        : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
        : "${INTERIOR_PRERELEASE:?INTERIOR_PRERELEASE 为空——第一步没跑成功}"

        # 标题与 GitHub 侧同口径：「IPVibe <版本号>」，预发布再加 (预发布) 后缀；
        # tag 仍是纯版本号，不要动
        project_name="IPVibe"
        if [ "${INTERIOR_PRERELEASE}" = "true" ]; then
          release_title="${project_name} ${INTERIOR_VERSION} (预发布)"
          prerelease_json=true
        else
          release_title="${project_name} ${INTERIOR_VERSION}"
          prerelease_json=false
        fi

        printf '{\n  "tag": "%s",\n  "title": "%s",\n  "descriptionFromFile": "release_body.md",\n  "preRelease": %s\n}\n' \
          "${INTERIOR_VERSION}" "${release_title}" "${prerelease_json}" > ./.cnb-release-options.json
        cat ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/build/internal-steps/git/release.html
    # tag / title / preRelease / descriptionFromFile 全部来自上一步写出的 JSON。
    # ⚠️ 参数名是 preRelease（驼峰），不是 prerelease —— 写成小写会被静默忽略。
    # 版本号带 -rc / -beta / -alpha / -nightly 后缀才勾选「预发布」，正式版不勾，不接受人工输入。
    - name: 创建 Release
      type: git:release
      optionsFrom: ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        tag: ${INTERIOR_VERSION}
        attachments:
          - 'bin/*'
      exports:
        FILES: FILES

    - name: 输出 Release 附件
      script: echo $FILES

    # 清理旧 nightly（与 GitHub release.yml 的「只保留最近 3 个」同口径）。
    # 镜像侧每天被动同步一次，tag 各不相同，不清理就会无限堆积（Release + tag + 附件）；
    # GitHub 侧删掉的旧 nightly 也不会自动从 CNB 消失。
    # 只处理日期 nightly（tag 以 -nightly.YYYYMMDD 结尾），rc / beta / alpha 与正式版一律不动。
    - name: 清理旧 nightly（只保留最近 3 个）
      script: |
        set -eu
        TAG="${INTERIOR_VERSION}"
        case "${INTERIOR_PRERELEASE}:${TAG}" in
          true:*-nightly.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
          *) echo "非日期 nightly 发布（${TAG}），跳过清理"; exit 0 ;;
        esac

        # 清理是「尽力而为」：从这里开始关掉 errexit。stage 一红整条同步流水线就算失败，
        # 而发布本身已经完成了，所以任何一步失败只打印，不让 stage 失败。
        set +e

        API="${CNB_API_ENDPOINT%/}"
        REPO="$CNB_REPO_SLUG"

        # 列表形状兼容裸数组与 {items|list|data: [...]} 包装
        RAW=$(curl -sS -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/releases?page=1&page_size=100")
        if ! printf '%s' "$RAW" | jq -e . >/dev/null 2>&1; then
          echo "⚠ 获取 Release 列表失败，跳过 nightly 清理"
          printf '  响应：%s\n' "$(printf '%s' "$RAW" | head -c 200)"
          exit 0
        fi

        OLD_TAGS=$(printf '%s' "$RAW" | jq -r '
          (if type == "array" then . else (.items // .list // .data // []) end)
          | .[]
          | select((.draft // false) | not)
          | select(.prerelease == true)
          | .tag_name
          | select(test("-nightly\\.[0-9]{8}$"))
        ' 2>/dev/null | sort -rV || true)

        TOTAL=$(printf '%s\n' "$OLD_TAGS" | grep -c . || true)
        if [ "${TOTAL:-0}" -le 3 ]; then
          echo "nightly Release 共 ${TOTAL:-0} 个，无需清理"
          exit 0
        fi

        # 前 3 个是保留项，其余逐个删：DeleteRelease 不会连带删 tag，两个对象必须分别删。
        printf '%s\n' "$OLD_TAGS" | tail -n +4 | while IFS= read -r OLD; do
          [ -n "$OLD" ] || continue
          REL=$(curl -sS -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/tags/$OLD")
          ID=$(printf '%s' "$REL" | jq -r '.id // .release_id // empty' 2>/dev/null)
          if [ -n "$ID" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Accept: application/vnd.cnb.api+json" \
              "$API/$REPO/-/releases/$ID")
            case "$CODE" in
              200|204) echo "已删除旧 nightly release ${OLD}（id=${ID}）" ;;
              *) echo "⚠ 删除 release ${OLD}（id=${ID}）失败 HTTP=${CODE}" ;;
            esac
          else
            echo "⚠ 未取到 ${OLD} 的 release id，跳过删除"
          fi
          TCODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/tags/$OLD")
          case "$TCODE" in
            200|204) echo "已删除同名 tag ${OLD}" ;;
            *) echo "⚠ 删除 tag ${OLD} 失败 HTTP=${TCODE}" ;;
          esac
        done

master:
  # 手动触发：通过页面自定义按钮执行（预发布看版本号后缀，页面不再有勾选框）
  web_trigger_release:
    - *trigger_release

  # API 触发：由 GitHub Actions 发布 Release 后调用 CNB Open API 触发（event=api_trigger_release）
  # 需通过 env 传入 version 变量（如 {"version":"v1.2.3"} / {"version":"v1.2.3-rc.1"} / {"version":"v1.2.4-nightly.20260101"}）。
  # 预发布标记由 version 后缀推导，env 里的 pre_release 已废弃（传了也不看，避免两套口径打架）。
  api_trigger_release:
    - *trigger_release
