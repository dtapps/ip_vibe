# 发布工作流（CNB 分支按钮「打包 Go 项目」）：全平台压缩包 + Release + 附件
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 GitHub 的
# .github/workflows/release.yml 同口径）：
#   v1.2.3                  -> 正式版，Release 不勾选 prerelease
#   v1.2.3-rc.1             -> 预发布（rc 渠道），Release 勾选 prerelease
#   v1.2.3-beta.1           -> 预发布（beta 渠道），Release 勾选 prerelease
#   v1.2.3-alpha.1          -> 预发布（alpha 渠道），Release 勾选 prerelease
#   v1.2.3-nightly.20260101 -> 预发布（nightly 渠道），Release 勾选 prerelease
#
# Release 标题：IPVibe <版本号>，预发布再加 "(预发布)" 后缀；tag 始终是纯版本号。

'**':
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_release:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        image: docker.cnb.cool/dtapp/golang:latest # 统一使用 CNB 内部 CI 基础镜像
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      stages:
        - name: 输出基本信息
          script: |
            echo "原始 version: $version"

            # 归一化（补 v 前缀）与预发布判定只有一份实现，CNB 与 GitHub 都 source 它，
            # 避免两边各写一套 grep 正则、判断口径慢慢跑偏。
            # 结果：TAG（带 v 前缀）/ PRERELEASE（true|false）/ VERSION_TYPE / PRE_NOTE
            # 版本号为空或含非法字符时 resolve_version 返回 1，这里直接让 stage 失败，
            # 而不是打出 :v 这种非法 tag，或把引号带进后面 optionsFrom 的 JSON。
            . scripts/ci/resolve-prerelease.sh
            resolve_version "$version" || exit 1
            echo "$PRE_NOTE"

            # 通过 set-output 输出到 result，由下方 exports 映射成后续 stage 的环境变量。
            echo "##[set-output interior_version=$TAG]"
            echo "##[set-output interior_prerelease=$PRERELEASE]"
          exports:
            interior_version: INTERIOR_VERSION
            interior_prerelease: INTERIOR_PRERELEASE

        - name: 安装所有依赖
          script: make deps

        - name: 构建前端静态文件
          script: VERSION=${INTERIOR_VERSION} make build-frontend

        - name: 构建所有平台二进制文件
          script: VERSION=${INTERIOR_VERSION} make build-all

        - name: 清理二进制文件
          script: make clean-binaries

        - name: 生成校验文件
          script: |
            set -eu
            cd bin
            : > SHA256SUMS
            for f in *.tar.gz *.zip; do
              [ -e "$f" ] || continue
              sha256sum "$f" >> SHA256SUMS
            done
            cat SHA256SUMS

        # 发版前先把版本号这件事验干净。这三件事出错都不会让构建失败，
        # 但会发出一个「看起来成功、内容是错的」Release：
        #   1) tag 没拉全 → changelog 算不出基准，正文变成「首次发布」
        #   2) tag 已经存在 → 覆盖已有 tag，历史 Release 的对比基准跟着变
        #   3) 版本号比已有的还旧 → 正文里 diff 是反的
        - name: 校验版本号与 tag
          script: |
            set -eu
            echo "版本号: ${INTERIOR_VERSION}"

            # tag 拉全（CNB 的 checkout 不一定带 tag，缺了就没法算基准）
            git fetch --tags --quiet --force || true
            count=$(git tag -l 'v*' | wc -l | tr -d ' ')
            echo "本地版本 tag: ${count} 个"
            if [ "$count" -eq 0 ]; then
              echo "❌ 一个版本 tag 都没有，changelog 会退化成「首次发布」"
              echo "   检查 checkout 是否带 tag，或手动 git fetch --tags"
              exit 1
            fi

            # tag 不能已经存在：重跑同一次发布会把 tag 挪到新提交上
            if git rev-parse -q --verify "refs/tags/${INTERIOR_VERSION}" >/dev/null; then
              echo "❌ tag ${INTERIOR_VERSION} 已存在，不能重复发布"
              echo "   已有指向: $(git rev-parse --short "${INTERIOR_VERSION}")"
              echo "   当前 HEAD: $(git rev-parse --short HEAD)"
              exit 1
            fi
            echo "✅ tag ${INTERIOR_VERSION} 不存在，可以发布"

            # 新版本必须比已有的正式版更新，否则正文里的 diff 是反的
            if [ "${INTERIOR_PRERELEASE}" = "false" ]; then
              latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
              if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${INTERIOR_VERSION}" | sort -V | tail -n 1)" != "${INTERIOR_VERSION}" ]; then
                echo "❌ 版本号 ${INTERIOR_VERSION} 比已有的正式版 ${latest} 旧"
                exit 1
              fi
              echo "✅ 比上一个正式版 ${latest:-（无）} 新"
            fi

        # 正文与更新内容只有一份实现（scripts/ci/*.sh），GitHub 那份也调用同样的脚本，
        # 避免两边各写一遍表格/标题/下载链接，改一处忘一处。
        - name: 生成 Release 正文
          script: |
            set -eu
            # 打包没出产物就别往下走：否则会发出一个零附件的 Release，正文表格是空的，
            # 看起来「成功」，用户点开什么都下不到。
            count=$(find bin -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "❌ 打包没有产出任何压缩包，先看 make build-all 的日志"
              exit 1
            fi
            echo "产物 ${count} 个"

            CNB_BASE="${CNB_REPO_URL_HTTPS%/}"
            # changelog：按渠道选对比基准（rc 对 rc、beta 对 beta、nightly 对 nightly、
            # 正式版对正式版；首次发某渠道则回退到上一个正式版）。实现见 scripts/ci/release-changelog.sh。
            # 脚本挑不出基准时会 exit 1（而不是谎报「首次发布」），这里显式接住，
            # 免得 CNB 不传播退出码、正文带着错误提示发出去。
            # CNB 的 Web 路径统一带 /-/ 前缀（releases 是 /-/releases，提交是 /-/commit），
            # 和 GitHub 的 /commit 不同，所以前缀由调用方传，脚本里不猜。
            if ! LATEST_CHANGE_LOG="$(REPO_URL="${CNB_BASE}" \
              COMMIT_URL="${CNB_BASE}/-/commit" \
              sh scripts/ci/release-changelog.sh "${INTERIOR_VERSION}")"; then
              echo "❌ 生成更新内容失败，见上面的错误信息"
              exit 1
            fi
            VERSION="${INTERIOR_VERSION}" \
              PRERELEASE="${INTERIOR_PRERELEASE}" \
              DL_BASE="${CNB_BASE}/-/releases/download/${INTERIOR_VERSION}" \
              STABLE_URL="${CNB_BASE}/-/releases" \
              REPO_URL="${CNB_BASE}" \
              COMMIT_URL="${CNB_BASE}/-/commit" \
              COMMIT_SHA="${CNB_COMMIT:-}" \
              BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              ARTIFACT_DIR=bin \
              ARTIFACT_LAYOUT=triplet \
              OUT_FILE=release_body.md \
              CHANGELOG="${LATEST_CHANGE_LOG}" \
              sh scripts/ci/render-release-body.sh

        # 生成 Release 选项文件，供 git:release 的 optionsFrom 读取。
        #
        # 为什么不用 options 里的 ${INTERIOR_PRERELEASE} 直接插值：preRelease 的类型是严格的
        # Boolean（对比 latest 明确允许 "true"|"false" 字符串），而变量替换产出的是字符串
        # "false"，字符串在布尔位置上容易被当成真值，导致正式版也被勾成预发布。
        # 走 optionsFrom 读到的是 JSON 里真正的布尔值，没有这个歧义。
        # descriptionFromFile 同理：正文里有反引号、管道符和换行，塞进插值里容易被转义毁掉。
        - name: 生成 Release 选项文件
          script: |
            set -eu
            # 空值写进配置后 git:release 会当成脏配置，报错还落在「发布」那一步，
            # 跟真正的原因隔了三屏。空就直接死在这一步。
            : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
            : "${INTERIOR_PRERELEASE:?INTERIOR_PRERELEASE 为空——第一步没跑成功}"

            # 标题与 GitHub 侧同口径：「IPVibe <版本号>」，预发布再加 (预发布) 后缀；
            # tag 仍是纯版本号，不要动
            project_name="IPVibe"
            if [ "${INTERIOR_PRERELEASE}" = "true" ]; then
              release_title="${project_name} ${INTERIOR_VERSION} (预发布)"
              prerelease_json=true
            else
              release_title="${project_name} ${INTERIOR_VERSION}"
              prerelease_json=false
            fi

            printf '{\n  "tag": "%s",\n  "title": "%s",\n  "descriptionFromFile": "release_body.md",\n  "preRelease": %s\n}\n' \
              "${INTERIOR_VERSION}" "${release_title}" "${prerelease_json}" > ./.cnb-release-options.json
            cat ./.cnb-release-options.json

        # https://docs.cnb.cool/zh/build/internal-steps/git/release.html
        # tag / title / preRelease / descriptionFromFile 全部来自上一步写出的 JSON。
        # ⚠️ 参数名是 preRelease（驼峰），不是 prerelease —— 写成小写会被静默忽略。
        # 版本号带 -rc / -beta / -alpha / -nightly 后缀才勾选「预发布」，正式版不勾，不接受人工输入。
        - name: 创建 Release
          type: git:release
          optionsFrom: ./.cnb-release-options.json

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - 'bin/*'
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
