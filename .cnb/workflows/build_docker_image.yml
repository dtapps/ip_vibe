"**":
  # 自定义按钮可触发的事件：web_trigger_build_docker_image
  web_trigger_build_docker_image:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        cpus: 64 # 如有需要，可根据实际情况调整
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        image: golang:1.25.4-trixie # 使用官方 Golang 镜像，版本固定
        volumes:
          - /root/.cache/go-build:copy-on-write # 挂载 Go 构建缓存
          - /go:copy-on-write # 挂载项目依赖目录（可选，根据需要）
      imports: https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 导入外部环境变量/配置
      stages:
        - name: 验证 make 工具
          script: make --version

        - name: 输出基本信息
          script: |
            echo "原始 goproxy: $goproxy"
            echo "原始 version: $version"
            echo "CNB_DOCKER_REGISTRY: ${CNB_DOCKER_REGISTRY}"
            echo "CNB_REPO_SLUG_LOWERCASE: ${CNB_REPO_SLUG_LOWERCASE}"

            # 1. 如果输入没有 v 前缀，自动加上
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi

            echo "处理 goproxy: $goproxy"
            echo "处理 version: $version"

            # 2 .通过 set-output 输出到 result
            echo "##[set-output interior_goproxy=$goproxy]"
            echo "##[set-output interior_version=$version]"
          exports:
            interior_goproxy: INTERIOR_GOPROXY
            interior_version: INTERIOR_VERSION

        - name: 构建并推送 Docker 镜像
          script: |
            echo "=============================="
            echo "🔧 开始处理 web_trigger_build_docker_image"
            echo "=============================="

            # 1. 配置 GOPROXY
            echo "配置 GOPROXY..."
            go env -w GO111MODULE=on
            go env -w GOPROXY="$INTERIOR_GOPROXY"

            # 2. 下载 Go 依赖
            echo "下载 Go 依赖..."
            go mod tidy
            go mod vendor

            # 3. 编译 Go 二进制
            echo "编译 Go 二进制..."
            make clean
            make build-linux-amd64

            # 4. 登录 Docker Registry
            echo "正在登录 Docker Registry: ${CNB_DOCKER_REGISTRY}"
            docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"
            echo "Docker 登录完成"

            BACKEND_IMAGE_NAME="${CNB_REPO_SLUG_LOWERCASE}/backend"  # 镜像名
            BACKEND_DOCKER_IMAGE_FULL="${CNB_DOCKER_REGISTRY}/${BACKEND_IMAGE_NAME}:${INTERIOR_VERSION}" # 版本镜像地址
            BACKEND_DOCKER_IMAGE_LATEST="${CNB_DOCKER_REGISTRY}/${BACKEND_IMAGE_NAME}:latest" # latest镜像地址

            REPORTER_IMAGE_NAME="${CNB_REPO_SLUG_LOWERCASE}/reporter"  # 镜像名
            REPORTER_DOCKER_IMAGE_FULL="${CNB_DOCKER_REGISTRY}/${REPORTER_IMAGE_NAME}:${INTERIOR_VERSION}" # 版本镜像地址
            REPORTER_DOCKER_IMAGE_LATEST="${CNB_DOCKER_REGISTRY}/${REPORTER_IMAGE_NAME}:latest" # latest镜像地址

            # 5. 构建 Docker 镜像
            echo " 构建 Docker 镜像..."
            docker build \
              --build-arg VERSION="${INTERIOR_VERSION}" \
              --build-arg BUILD_TIME="$(date +%Y-%m-%d_%H:%M:%S)" \
              -f "./cmd/backend/Dockerfile" \
              -t "${BACKEND_DOCKER_IMAGE_FULL}" \
              -t "${BACKEND_DOCKER_IMAGE_LATEST}" .
            docker build \
              --build-arg VERSION="${INTERIOR_VERSION}" \
              --build-arg BUILD_TIME="$(date +%Y-%m-%d_%H:%M:%S)" \
              -f "./cmd/reporter/Dockerfile" \
              -t "${REPORTER_DOCKER_IMAGE_FULL}" \
              -t "${REPORTER_DOCKER_IMAGE_LATEST}" .

            # 6. 推送 Docker 镜像
            echo " 推送 Docker 镜像..."
            docker push "${BACKEND_DOCKER_IMAGE_FULL}"
            docker push "${BACKEND_DOCKER_IMAGE_LATEST}"
            docker push "${REPORTER_DOCKER_IMAGE_FULL}"
            docker push "${REPORTER_DOCKER_IMAGE_LATEST}"

            echo "=============================="
            echo "🎉 处理结束 web_trigger_build_docker_image"
            echo "=============================="

        - name: 拉取 Git Tags（确保 changelog 能工作）
          script: git fetch --tags --unshallow 2>/dev/null || git fetch --tags

        # https://cnb.cool/cnb/plugins/cnbcool/changelog
        - name: 生成 changelog
          image: cnbcool/changelog
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: docker-${INTERIOR_VERSION}
            title: docker-"${INTERIOR_VERSION}"
            description: ${LATEST_CHANGE_LOG}

        # https://docs.cnb.cool/zh/plugin/#public/cnbcool/ai-review
        - name: 变更总结
          image: cnbcool/ai-review:latest
          settings:
            type: diff-summary
          exports:
            summary: SUMMARY

        - name: 输出变更总结
          script: echo $SUMMARY
