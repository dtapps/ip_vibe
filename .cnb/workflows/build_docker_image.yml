'**':
  # 自定义按钮可触发的事件：web_trigger_build_docker_image
  web_trigger_build_docker_image:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
        cpus: 64 # 如有需要，可根据实际情况调整
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      imports: https://cnb.cool/dtapp/envs/-/blob/main/docker.yml # 导入外部环境变量/配置
      stages:
        - name: 验证 make 工具
          script: make --version

        - name: 验证 go 工具
          script: go version

        - name: 验证 node 工具
          script: node --version

        - name: 验证 npm 工具
          script: npm --version

        - name: 验证 pnpm 工具
          script: pnpm --version

        - name: 验证 upx 工具
          script: upx --version

        - name: 验证 golangci-lint 工具
          script: golangci-lint --version

        - name: 验证 nfpm 工具
          script: nfpm --version

        - name: 验证 wixl 工具
          script: wixl --version

        - name: 输出基本信息
          script: |
            echo "原始 version: $version"
            echo "CNB_DOCKER_REGISTRY: ${CNB_DOCKER_REGISTRY}"
            echo "CNB_REPO_SLUG_LOWERCASE: ${CNB_REPO_SLUG_LOWERCASE}"

            # 1. 如果输入没有 v 前缀，自动加上
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi

            echo "处理 version: $version"

            # 2. 计算各镜像的名称与地址（构建/推送阶段共用）
            backend_image_name="${CNB_REPO_SLUG_LOWERCASE}/backend"
            reporter_image_name="${CNB_REPO_SLUG_LOWERCASE}/reporter"
            forwarder_image_name="${CNB_REPO_SLUG_LOWERCASE}/forwarder"

            backend_docker_image_full="${CNB_DOCKER_REGISTRY}/${backend_image_name}:${version}"
            backend_docker_image_latest="${CNB_DOCKER_REGISTRY}/${backend_image_name}:latest"

            reporter_docker_image_full="${CNB_DOCKER_REGISTRY}/${reporter_image_name}:${version}"
            reporter_docker_image_latest="${CNB_DOCKER_REGISTRY}/${reporter_image_name}:latest"

            forwarder_docker_image_full="${CNB_DOCKER_REGISTRY}/${forwarder_image_name}:${version}"
            forwarder_docker_image_latest="${CNB_DOCKER_REGISTRY}/${forwarder_image_name}:latest"

            # 3. 通过 set-output 输出到 result
            echo "##[set-output interior_version=$version]"
            echo "##[set-output interior_backend_image_name=$backend_image_name]"
            echo "##[set-output interior_backend_docker_image_full=$backend_docker_image_full]"
            echo "##[set-output interior_backend_docker_image_latest=$backend_docker_image_latest]"
            echo "##[set-output interior_reporter_image_name=$reporter_image_name]"
            echo "##[set-output interior_reporter_docker_image_full=$reporter_docker_image_full]"
            echo "##[set-output interior_reporter_docker_image_latest=$reporter_docker_image_latest]"
            echo "##[set-output interior_forwarder_image_name=$forwarder_image_name]"
            echo "##[set-output interior_forwarder_docker_image_full=$forwarder_docker_image_full]"
            echo "##[set-output interior_forwarder_docker_image_latest=$forwarder_docker_image_latest]"
          exports:
            interior_version: INTERIOR_VERSION
            interior_backend_image_name: INTERIOR_BACKEND_IMAGE_NAME
            interior_backend_docker_image_full: INTERIOR_BACKEND_DOCKER_IMAGE_FULL
            interior_backend_docker_image_latest: INTERIOR_BACKEND_DOCKER_IMAGE_LATEST
            interior_reporter_image_name: INTERIOR_REPORTER_IMAGE_NAME
            interior_reporter_docker_image_full: INTERIOR_REPORTER_DOCKER_IMAGE_FULL
            interior_reporter_docker_image_latest: INTERIOR_REPORTER_DOCKER_IMAGE_LATEST
            interior_forwarder_image_name: INTERIOR_FORWARDER_IMAGE_NAME
            interior_forwarder_docker_image_full: INTERIOR_FORWARDER_DOCKER_IMAGE_FULL
            interior_forwarder_docker_image_latest: INTERIOR_FORWARDER_DOCKER_IMAGE_LATEST

        - name: 安装依赖
          script: make deps

        - name: 构建前端静态文件
          script: VERSION=${INTERIOR_VERSION} make build-frontend

        - name: 构建后端二进制文件
          script: VERSION=${INTERIOR_VERSION} make build-linux-amd64

        - name: 登录 Docker Registry
          script: |
            docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"

        - name: 构建 Docker Backend 镜像
          script: |
            docker build \
              -f "./cmd/backend/Dockerfile" \
              -t "${INTERIOR_BACKEND_DOCKER_IMAGE_FULL}" \
              -t "${INTERIOR_BACKEND_DOCKER_IMAGE_LATEST}" .

        - name: 构建 Docker Reporter 镜像
          script: |
            docker build \
              -f "./cmd/reporter/Dockerfile" \
              -t "${INTERIOR_REPORTER_DOCKER_IMAGE_FULL}" \
              -t "${INTERIOR_REPORTER_DOCKER_IMAGE_LATEST}" .

        - name: 构建 Docker Forwarder 镜像
          script: |
            docker build \
              -f "./cmd/forwarder/Dockerfile" \
              -t "${INTERIOR_FORWARDER_DOCKER_IMAGE_FULL}" \
              -t "${INTERIOR_FORWARDER_DOCKER_IMAGE_LATEST}" .

        - name: 推送 Docker Backend 镜像
          script: |
            docker push "${INTERIOR_BACKEND_DOCKER_IMAGE_FULL}"
            docker push "${INTERIOR_BACKEND_DOCKER_IMAGE_LATEST}"

        - name: 推送 Docker Reporter 镜像
          script: |
            docker push "${INTERIOR_REPORTER_DOCKER_IMAGE_FULL}"
            docker push "${INTERIOR_REPORTER_DOCKER_IMAGE_LATEST}"

        - name: 推送 Docker Forwarder 镜像
          script: |
            docker push "${INTERIOR_FORWARDER_DOCKER_IMAGE_FULL}"
            docker push "${INTERIOR_FORWARDER_DOCKER_IMAGE_LATEST}"
